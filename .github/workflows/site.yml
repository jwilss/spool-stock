name: Publish site
on:
  push:
    branches: [main]
    paths: ["site/**", "orca-plugin/spoolstock/**", ".github/workflows/site.yml"]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Add the Firebase key
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          key=$(printf %s "$FIREBASE_API_KEY" | tr -d '[:space:]')
          if [ -z "$key" ]; then
            echo "::error::Add the FIREBASE_API_KEY secret under Settings > Secrets and variables > Actions"
            exit 1
          fi
          sed -i "s|__FIREBASE_API_KEY__|$key|" site/config.js
      - name: Refresh the filament catalogue
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/Donkie/SpoolmanDB.git "$RUNNER_TEMP/spoolmandb"
          git clone --depth 1 https://github.com/OpenFilamentCollective/open-filament-database.git "$RUNNER_TEMP/ofd"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/OrcaSlicer/OrcaSlicer.git "$RUNNER_TEMP/orca"
          git -C "$RUNNER_TEMP/orca" sparse-checkout set resources/profiles/OrcaFilamentLibrary
          node tools/build-catalogue.mjs "$RUNNER_TEMP/spoolmandb" site/catalogue.json "$RUNNER_TEMP/ofd" "$RUNNER_TEMP/orca"
      - name: Add the Orca plugin
        run: cp orca-plugin/spoolstock/spool_stock.py site/spool_stock.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
