name: Build apps
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wrappers/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npx cap add android
      - name: Allow the camera
        run: sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />#' android/app/src/main/AndroidManifest.xml
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: wrappers/android/android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk SpoolStock.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: wrappers/android/SpoolStock.apk
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: wrappers/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: wrappers/windows/dist/SpoolStock.exe
  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: Spool Stock ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build {0}', github.run_number) }}
          files: |
            SpoolStock.apk
            SpoolStock.exe
          make_latest: true
