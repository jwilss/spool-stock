name: Fetch brand logos
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node tools/fetch-logos.mjs logos
      - uses: actions/upload-artifact@v4
        with:
          name: brand-logos
          path: logos
          retention-days: 3
