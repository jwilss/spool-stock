<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spool Stock</title>
<meta name="theme-color" content="#FFC800">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a workshop stock board. Storages are drawn as racks of spools, the filament colour and remaining weight drive the graphics, yellow marks the action. */
:root{
  --bg:#E8ECEE; --panel:#F8FAFB; --panel2:#DFE5E8; --ink:#161C20; --muted:#55626A; --line:#C4CED3;
  --tag:#FFC800; --tag-ink:#161C20; --good:#17764A; --warn:#A85600; --bad:#B3261E;
  --disp:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101518; --panel:#192126; --panel2:#232D33; --ink:#E9EFF2; --muted:#9BA9B1; --line:#303C43;
  --good:#4CC38A; --warn:#F0A94B; --bad:#F2857C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101518; --panel:#192126; --panel2:#232D33; --ink:#E9EFF2; --muted:#9BA9B1; --line:#303C43;
  --good:#4CC38A; --warn:#F0A94B; --bad:#F2857C; color-scheme:dark}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
*{box-sizing:border-box}
a.btn{text-decoration:none}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--disp);font-weight:700;letter-spacing:.01em;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:30px}h2{font-size:22px}h3{font-size:18px}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.shell{display:grid;grid-template-columns:1fr;grid-template-rows:auto 1fr;min-height:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--panel)}
.brand{font:700 21px/1 var(--disp);letter-spacing:.05em;text-transform:uppercase;background:var(--tag);color:var(--tag-ink);padding:5px 9px 4px;border:0;cursor:pointer}
.main{padding-block:16px 112px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px;align-content:start;min-width:0;max-width:980px;width:100%;margin-inline:auto}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav button{background:none;border:0;padding:9px 2px 8px;display:grid;justify-items:center;gap:2px;font:600 15px/1 var(--disp);letter-spacing:.03em;color:var(--muted);cursor:pointer}
.nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--ink);box-shadow:inset 0 3px 0 var(--tag)}
.nav .scan{color:var(--tag-ink);background:var(--tag)}
.nav .scan[aria-current="page"]{color:var(--tag-ink);box-shadow:none}
@media (min-width:860px){
  .shell{grid-template-columns:150px 1fr;grid-template-rows:auto 1fr}
  .top{grid-column:1/-1}
  .nav{position:sticky;top:0;align-self:start;grid-template-columns:1fr;border-top:0;border-right:0;background:none;padding:14px 0 0 max(16px,env(safe-area-inset-left,0px))}
  .nav button{grid-template-columns:24px 1fr;justify-items:start;align-items:center;gap:8px;padding:10px;font-size:17px}
  .nav button[aria-current="page"]{box-shadow:inset 3px 0 0 var(--tag)}
  .main{padding-bottom:40px}
}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:9px 14px;border:1px solid var(--line);background:var(--panel);font-weight:600;cursor:pointer;text-align:center;border-radius:2px}
.btn.go{background:var(--tag);color:var(--tag-ink);border-color:var(--tag)}
.btn.bad{color:var(--bad);border-color:var(--bad);background:none}
.btn.sm{min-height:36px;padding:5px 10px;font-size:15px}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.nav button:focus-visible,.slot:focus-visible,.row:focus-visible,.cell:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.card{background:var(--panel);border:1px solid var(--line);padding:14px;display:grid;gap:12px;min-width:0}
.field{display:grid;gap:4px;min-width:0}
.field>span,.lab{font-size:14px;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=search],select,textarea{width:100%;min-height:44px;padding:8px 10px;background:var(--bg);border:1px solid var(--line);border-radius:2px;min-width:0}
input[type=color]{width:44px;height:44px;padding:2px;background:var(--bg);border:1px solid var(--line);border-radius:2px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:end}
.g4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:end}
@media (min-width:560px){.g4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.split{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:760px){.split{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}}
/* racks */
.summary{font:600 19px/1.2 var(--disp);letter-spacing:.02em}
.racks{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.rack{background:var(--panel);border:1px solid var(--line);padding:10px;display:grid;gap:8px;align-content:start;min-width:0}
.rack h3{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.rackname{background:none;border:0;padding:0;font:inherit;letter-spacing:inherit;text-align:left;cursor:pointer;overflow-wrap:anywhere;min-width:0}
.grouphead{margin-bottom:-8px}
.slots{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:6px}
.slot{background:var(--bg);border:1px solid var(--line);padding:6px 2px 5px;display:grid;justify-items:center;gap:2px;cursor:pointer;min-width:0}
.slot .disc{max-width:100%;height:auto}
.slot small{font:500 12px/1 var(--mono)}
.slot.empty{border-style:dashed}
.shelf{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:44px;cursor:pointer;background:var(--bg);border:1px solid var(--line);padding:6px;width:100%;text-align:left}
.disc{display:block;flex:none}
.disc .fl{fill:var(--panel2);stroke:var(--muted);stroke-width:2}
.disc .hub{fill:var(--panel);stroke:var(--muted);stroke-width:2}
.disc .hole{fill:var(--bg);stroke:var(--muted);stroke-width:2}
.disc .fil{stroke:rgba(0,0,0,.28);stroke-width:1}
/* list */
.tools{display:grid;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);padding:5px 10px;min-height:34px;font-size:15px;font-weight:500;cursor:pointer;border-radius:2px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:grid;gap:6px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);padding:8px 10px;width:100%;text-align:left;cursor:pointer}
.row b{font-weight:600;display:block;overflow-wrap:anywhere}
.row .sub{display:block;color:var(--muted);font-size:15px;overflow-wrap:anywhere}
.row .end{text-align:right;font-size:14px;line-height:1.25}
.pill{display:inline-block;font:600 13px/1 var(--body);padding:3px 6px;border:1px solid currentColor;border-radius:2px;white-space:nowrap}
.pill.low{color:var(--warn)}.pill.ex{color:var(--muted)}.pill.good{color:var(--good)}
.bar{height:6px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink)}
.bar.low i{background:var(--warn)}
/* spool page */
.spoolhead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.code{font:600 15px/1 var(--mono);letter-spacing:.04em}
.spec{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px}
.spec div{min-width:0}
.spec dt{font-size:14px;font-weight:600;color:var(--muted)}
.spec dd{margin:0;font-family:var(--mono);font-size:15px}
.movegroup{display:grid;gap:6px}
.movegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.spacegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:6px}
.move{min-height:52px;display:grid;gap:1px;align-content:center;justify-items:start;text-align:left;background:var(--bg);border:1px solid var(--line);padding:6px 9px;cursor:pointer;font-weight:600}
.move small{font-weight:400;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.move[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.move[aria-current="true"] small{color:inherit}
.note{border-left:4px solid var(--tag);background:var(--panel);padding:9px 12px}
.note.warn{border-left-color:var(--warn)}
.hist{display:grid;gap:3px;font-size:15px}
/* stickers */
.sticker{background:#fff;border:1px solid var(--line);display:block;max-width:100%;height:auto}
.sheetmap{display:grid;gap:2px;background:var(--panel2);padding:6px;max-width:300px;width:100%}
.cell{aspect-ratio:var(--ar);background:var(--panel);border:1px solid var(--line);cursor:pointer;padding:0;min-width:0}
.cell.used{background:repeating-linear-gradient(45deg,var(--panel2),var(--panel2) 3px,var(--bg) 3px,var(--bg) 6px)}
.cell.next{background:var(--tag);border-color:var(--tag-ink)}
.check{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);padding:8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.tile{position:relative;display:block;cursor:pointer;min-width:0}
.tile input{position:absolute;top:4px;right:4px;width:22px;height:22px;margin:0}
.tile .sticker{width:100%}
.tile:has(input:not(:checked)) .sticker{opacity:.35}
.sheetfirst{order:2}
@media (max-width:759px){.sheetfirst{order:0}.queuecard{order:1}}
.check input{width:22px;height:22px}
/* photo */
.drop{display:grid;justify-items:center;gap:8px;padding:20px 12px;border:2px dashed var(--line);background:var(--panel);text-align:center;cursor:pointer}
.drop.over{border-color:var(--ink)}
.thumbs{display:flex;flex-wrap:wrap;gap:6px}
.thumbs img{width:84px;height:84px;object-fit:cover;border:1px solid var(--line)}
.logo{height:40px;max-width:120px;object-fit:contain;background:#fff;padding:3px;border:1px solid var(--line)}
.crop{position:relative;touch-action:none;user-select:none;line-height:0;max-width:100%}
.crop img{width:100%;height:auto;display:block;pointer-events:none}
.crop i{position:absolute;border:2px solid var(--tag);box-shadow:0 0 0 2000px rgba(0,0,0,.45);pointer-events:none}
.cropwrap{overflow:hidden}
.match{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);padding:8px;background:var(--bg)}
.score{font:700 22px/1 var(--disp)}
.swatches{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sw{width:30px;height:30px;border:1px solid var(--muted);cursor:pointer;padding:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:10px 12px;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);width:max-content;font-weight:500}
.toast button{background:none;border:1px solid currentColor;color:inherit;padding:4px 9px;cursor:pointer;font-weight:600}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:16px}
.modal>div{background:var(--panel);border:1px solid var(--line);padding:16px;display:grid;gap:12px;max-width:440px;width:100%}
.busy{display:flex;gap:10px;align-items:center;font-weight:600}
.spin{width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.storerow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:8px}
.storerow b{display:block;font-weight:600;overflow-wrap:anywhere}
.storerow .sub{display:block;color:var(--muted);font-size:15px;overflow-wrap:anywhere}
.shift{display:grid;grid-template-columns:36px 36px;gap:4px}
.shift .btn{padding:0;min-width:36px}
.shift svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.typepick{position:relative;display:block;cursor:pointer;min-width:0}
.typepick input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.typepick span{display:grid;gap:2px;height:100%;padding:9px 10px;background:var(--bg);border:1px solid var(--line)}
.typepick b{font-weight:600}
.typepick small{color:var(--muted);font-size:14px;line-height:1.25}
.typepick input:checked+span{background:var(--tag);color:var(--tag-ink);border-color:var(--tag)}
.typepick input:checked+span small{color:inherit}
.typepick input:focus-visible+span{outline:2px solid var(--ink);outline-offset:2px}
.hint{color:var(--muted);font-size:14px}
.picks{max-height:264px;overflow:auto;margin-top:-8px;border:1px solid var(--line);border-top:0;background:var(--bg)}
.pick{display:grid;gap:1px;width:100%;min-height:44px;padding:7px 10px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer}
.pick:last-child{border-bottom:0}
.pick:hover,.pick:focus-visible{background:var(--panel2)}
.pick b{font-weight:600;overflow-wrap:anywhere}
.pick small{color:var(--muted);font-size:14px}
.picknone{padding:9px 10px;color:var(--muted);font-size:15px}
.catcols{display:grid;gap:4px}
.catcols .swatches{max-height:148px;overflow:auto}
.logoPick{background:#fff;border:1px solid var(--line);padding:6px;display:grid;gap:4px;cursor:pointer;color:#000;font-size:13px;text-align:center}
.logoPick img{height:56px;width:100%;object-fit:contain}
.brandrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:8px}
.camwrap{position:relative;aspect-ratio:4/3;background:#000;overflow:hidden;max-height:60vh;width:100%}
.camwrap video{width:100%;height:100%;object-fit:cover;display:block}
.camwrap i{position:absolute;top:50%;left:50%;height:72%;aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid var(--tag);pointer-events:none}
.scanstate{font:700 22px/1.15 var(--disp);min-height:50px;display:grid;align-items:center}
.scanstate.held{background:var(--tag);color:var(--tag-ink);padding:8px 10px}
.authcard{max-width:420px;margin-inline:auto;width:100%}
.authbad{color:var(--bad);font-weight:600}
</style>
</head>
<body>

<div class="shell">
  <header class="top">
    <button class="brand" data-go="stock">Spool Stock</button>
    <button class="btn sm" data-go="setup">Setup</button>
  </header>
  <nav class="nav" aria-label="Main">
    <button data-go="stock" data-nav="stock"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>Stock</button>
    <button data-go="add" data-nav="add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add</button>
    <button class="scan" data-go="scan" data-nav="scan"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/><path d="M9 12h6"/></svg>Scan</button>
    <button data-go="stickers" data-nav="stickers"><svg viewBox="0 0 24 24"><path d="M5 4h14v11l-5 5H5z"/><path d="M19 15h-5v5"/></svg>Stickers</button>
  </nav>
  <main class="main" id="main"><div class="busy"><span class="spin"></span>Opening your stock</div></main>
</div>
<div id="toast" class="toast" hidden></div>
<div id="modal" class="modal" hidden></div>
<input type="file" id="pickScan" accept="image/*" capture="environment" hidden>
<input type="file" id="pickLogo" accept="image/*" hidden>
<input type="file" id="pickImport" accept=".json,application/json,text/plain" hidden>

<script src="config.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="vendor/jsQR.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/firebase-app-compat.js"></script>
<script src="vendor/firebase-auth-compat.js"></script>
<script src="vendor/firebase-firestore-compat.js"></script>
<script>
"use strict";
const CFG = window.SPOOL_CONFIG || {};
const PAGE_URL = CFG.siteUrl || (location.origin + location.pathname);
const IS_APP = /SpoolStockApp/.test(navigator.userAgent);

/* Typical starting settings per material (bed values for a smooth PEI or high temperature plate). */
const MATERIALS = [
  {key:"PETG-CF", re:/PETG[\s-]*(CF|GF)/i, n:[240,270], b:[60,80], d:[70,8]},
  {key:"PETG",    re:/PETG|\bHF\b/i,       n:[240,270], b:[60,80], d:[70,8]},
  {key:"PLA-CF",  re:/PLA[\s-]*(CF|GF)/i,  n:[210,240], b:[45,65], d:[55,8]},
  {key:"PLA",     re:/PLA/i,               n:[190,240], b:[45,65], d:[55,8]},
  {key:"ABS",     re:/ABS/i,               n:[240,280], b:[90,100],d:[80,8]},
  {key:"ASA",     re:/ASA/i,               n:[240,280], b:[90,100],d:[80,8]},
  {key:"TPU",     re:/TPU|TPE/i,           n:[200,250], b:[35,45], d:[70,8]},
  {key:"PET-CF",  re:/PET[\s-]*(CF|GF)/i,  n:[260,300], b:[100,120],d:[80,12]},
  {key:"PPA-CF",  re:/PPA/i,               n:[285,320], b:[100,120],d:null},
  {key:"PPS",     re:/PPS/i,               n:[285,330], b:[100,120],d:null},
  {key:"PA-CF",   re:/(PA|PAHT|PA6|PA12)[\s-]*(CF|GF)/i, n:[260,300], b:[100,120],d:[80,12]},
  {key:"PA",      re:/\bPA\b|PAHT|PA6|PA12|nylon/i,      n:[260,290], b:[100,120],d:[80,12]},
  {key:"PC",      re:/\bPC\b|polycarbonate/i,            n:[260,290], b:[100,120],d:[80,8]},
  {key:"PVA",     re:/PVA|BVOH/i,          n:[190,240], b:[45,65], d:[55,8]},
];
const BRANDS = ["Bambu Lab","eSUN","Polymaker","SUNLU","Overture","Prusament","ELEGOO","JAYO","Creality","Anycubic","Kingroon","Fiberlogy","Extrudr","ColorFabb","Spectrum","Hatchbox","3DJake","Geeetech","Eryone","AMOLEN","Siraya Tech","Flashforge","Fillamentum","Recreus","NinjaTek","Das Filament","Azurefilm","Rosa3D","Devil Design"];
const FINISH = ["","Matte","Glossy","Silk","Translucent","Sparkle","Marble","Dual colour"];
const COLOURS = ["#111111","#FFFFFF","#8A8D8F","#C8102E","#FF6A13","#FFD100","#00843D","#0057B8","#6D2077","#7B4B2A"];
const NAMED = [[/\bblack\b/i,"#111111"],[/\bwhite\b/i,"#F4F4F2"],[/\b(grey|gray|silver)\b/i,"#8A8D8F"],[/\bred\b/i,"#C8102E"],[/\borange\b/i,"#FF6A13"],[/\byellow\b/i,"#FFD100"],[/\bgold\b/i,"#C9A227"],[/\bgreen\b/i,"#00843D"],[/\bblue\b/i,"#0057B8"],[/\b(purple|violet)\b/i,"#6D2077"],[/\bpink\b/i,"#E86FA5"],[/\bbrown\b/i,"#7B4B2A"],[/\b(beige|sand|cream)\b/i,"#D9C7A0"]];
const ICON_SLUGS = {"bambu lab":"bambulab","creality":"creality","elegoo":"elegoo","anycubic":"anycubic","flashforge":"flashforge"};
const ICON_BASE = "https://cdn.jsdelivr.net/npm/simple-icons@16.36.0/icons/";

const SHEETS = [

/* Firestore keeps working with no signal: a write lands in the local copy at once and its promise only settles when the server answers, so the app never waits on it. */

const liveSpools = () => Object.values(S.spools).filter(s=>s.status!=="used");

/* A storage with spaces is one storage holding a fixed number of spools, one per numbered space. */
const spaced = l => !!(l&&l.spaces&&l.capacity>0);
function seated(l){
  const seats=Array(l.capacity).fill(null), rest=[];
  for(const s of inLoc(l.id)){ if(s.slot>=1&&s.slot<=l.capacity&&!seats[s.slot-1]) seats[s.slot-1]=s; else rest.push(s); }
  for(const s of rest){ const i=seats.indexOf(null); if(i>=0) seats[i]=s; }

}
const freeSpaces = l => seated(l).flatMap((s,i)=>s?[]:[i+1]);

const spotName = s => { const n=spaceOf(s); return locName(s.loc)+(n&&S.locs[s.loc].capacity>1?", space "+n:""); };

const locOptions = (sel,roomOnly) => orderedLocs().map(l=>{ const off=roomOnly&&isFull(l)&&sel!==l.id; return `<option value="${l.id}" ${sel===l.id?"selected":""} ${off?"disabled":""}>${esc(locName(l.id))}${off?" (full)":""}</option>`; }).join("");

function newLocId(name){ const base=slug(name).slice(0,24).replace(/-$/,"")||"storage"; let id=base, n=2; while(S.locs[id]||id==="new") id=base+"-"+n++; return id; }
const placer = id => { const l=S.locs[id], open=spaced(l)?freeSpaces(l):null; return ()=>{ if(!id) return {loc:null,slot:null}; if(!open) return {loc:id,slot:null}; const slot=open.shift(); return slot?{loc:id,slot}:{loc:null,slot:null}; }; };

const hexOK = h => /^#[0-9a-f]{6}$/i.test(h||"") ? h : "#9AA5AB";

let discId=0;
function disc(s,size=44){
  const r = s ? 24 + 23*Math.max(pct(s),.06) : 0;
  let fill="", def="";
  if(s){
    const c=colourList(s), pat=patternOf(s); fill=c[0];
    if(pat!=="solid"){
      const id="fil"+(++discId), n=c.length;
      const stops=pat==="gradient"?c.map((h,i)=>`<stop offset="${i/(n-1)}" stop-color="${h}"/>`).join(""):c.map((h,i)=>`<stop offset="${i/n}" stop-color="${h}"/><stop offset="${(i+1)/n}" stop-color="${h}"/>`).join("");
      def=`<defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1">${stops}</linearGradient></defs>`; fill=`url(#${id})`;
    }
  }
  return `<svg class="disc" width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true">${def}<circle class="fl" cx="50" cy="50" r="48"/>${s?`<circle class="fil" cx="50" cy="50" r="${r.toFixed(1)}" fill="${fill}"/>`:""}<circle class="hub" cx="50" cy="50" r="22"/><circle class="hole" cx="50" cy="50" r="9"/></svg>`;
}

const ALIASES = [["high speed","hs"],["high flow","hf"],["carbon fibre","cf"],["carbon fiber","cf"],["glass fibre","gf"],["glass fiber","gf"]];
function searchText(...parts){

/* ---------- QR ---------- */
const qrUrl = code => PAGE_URL+"#"+code;
const qrCache = new Map();
function qrMatrix(text){
  if(qrCache.has(text)) return qrCache.get(text);
  const q = qrcode(0,"M"); q.addData(text); q.make();
  const n = q.getModuleCount(), m=[];
  for(let r=0;r<n;r++){ const row=[]; for(let c=0;c<n;c++) row.push(q.isDark(r,c)); m.push(row); }
  qrCache.set(text,m); return m;
}

/* ---------- sticker layout, in mm ---------- */
let measurer=null;
function tw(text,pt,font,bold){
  if(!measurer && window.jspdf) measurer=new jspdf.jsPDF({unit:"mm",format:"a4"});
  if(measurer){ measurer.setFont(font==="mono"?"courier":"helvetica",bold?"bold":"normal"); return measurer.getStringUnitWidth(text)*pt*25.4/72; }
  return text.length*pt*.54*25.4/72;
}
function fit(text,maxW,pt,minPt,font,bold){
  let s=pt; while(s>minPt && tw(text,s,font,bold)>maxW) s-=.25;
  let t=text; while(t.length>2 && tw(t,s,font,bold)>maxW) t=t.slice(0,-2).trimEnd()+".";
  return {text:t,pt:s};
}
const safe = t => String(t??"").replace(/[^\x20-\x7E\xA0-\xFF]/g,"");
function logoFit(b,boxW,boxH){
  const l=logoData(b); if(!l) return null;
  const a=(l.w||3)/(l.h||1); let w=boxW,h=w/a; if(h>boxH){h=boxH;w=h*a;}
  return {w,h,src:l.src,key:l.key};
}
function edgePoint(cx,cy,half,deg){
  const a=deg*Math.PI/180, dx=Math.cos(a), dy=Math.sin(a), k=half/Math.max(Math.abs(dx),Math.abs(dy));
  return [cx+dx*k,cy+dy*k];
}
const hexRGB = h => { const v=parseInt(hexOK(h).slice(1),16); return [v>>16,(v>>8)&255,v&255]; };
function mix(a,b,t){ const p=hexRGB(a), q=hexRGB(b), v=[0,1,2].map(i=>Math.round(p[i]+(q[i]-p[i])*t)); return "#"+v.map(n=>n.toString(16).padStart(2,"0")).join(""); }
/* colour box: one fill, triangles meeting in the middle, or a blend from left to right. Everything else on a sticker is black. */
function swatchOps(sp,x,y,sz){
  const c=colourList(sp), pat=patternOf(sp), ops=[], cx=x+sz/2, cy=y+sz/2, half=sz/2;
  if(pat==="split"){
    const n=c.length, step=360/n, start=-135, corners=[-135,-45,45,135];
    c.forEach((col,i)=>{
      const a=start+i*step, b=a+step;
      const marks=[a,...corners.flatMap(k=>[k,k+360]).filter(k=>k>a+.01&&k<b-.01).sort((p,q)=>p-q),b];
      for(let j=0;j<marks.length-1;j++){
        const p=edgePoint(cx,cy,half,marks[j]), q=edgePoint(cx,cy,half,marks[j+1]);
        ops.push({t:"tri",pts:[cx,cy,p[0],p[1],q[0],q[1]],fill:col});
      }
    });
  } else if(pat==="gradient"){
    const strips=48, w=sz/strips, n=c.length-1;
    for(let i=0;i<strips;i++){
      const t=(i+.5)/strips*n, k=Math.min(n-1,Math.floor(t));
      ops.push({t:"rect",x:x+i*w,y,w:w+.03,h:sz,fill:mix(c[k],c[k+1],t-k)});
    }
  } else ops.push({t:"rect",x,y,w:sz,h:sz,fill:c[0]});
  ops.push({t:"rect",x,y,w:sz,h:sz,stroke:"#000000"});
  return ops;
}
function spoolOps(sp,W,H){
  const m=2.2, ops=[], idH=3.8;
  const qs=Math.min(H-2*m-idH,W*.42);
  ops.push({t:"qr",x:m,y:m,s:qs,text:qrUrl(sp.id)});
  ops.push({t:"text",x:m+qs/2,y:m+qs+3.2,text:sp.id.toUpperCase(),pt:10,font:"mono",bold:1,align:"center"});
  const x=m+qs+2.2, cw=W-x-m;
  const lineH=3.05, specLines=3, logoH=Math.min(8.2,H*.22);
  const brand=S.brands[slug(sp.brand)];
  const lf=logoFit(brand,cw,logoH);
  if(lf) ops.push({t:"img",x,y:m,w:lf.w,h:lf.h,src:lf.src,key:lf.key});
  else { const f=fit(safe(sp.brand)||"Unknown",cw,12,7,"sans",1); ops.push({t:"text",x,y:m+Math.min(logoH-1.2,3.6),text:f.text,pt:f.pt,font:"sans",bold:1}); }
  let y=m+(lf?lf.h:Math.min(logoH-1.2,4.4))+1.2;
  const mat=fit(safe(sp.material)||"Filament",cw,17,9,"sans",1);
  y+=mat.pt*.3528*.76; ops.push({t:"text",x,y,text:mat.text,pt:mat.pt,font:"sans",bold:1}); y+=1.5;
  const sw=5; ops.push(...swatchOps(sp,x,y,sw));
  const cn=fit(safe(sp.colour)||"",cw-sw-1.3,9,6.5,"sans",0);
  ops.push({t:"text",x:x+sw+1.3,y:y+3.55,text:cn.text,pt:cn.pt,font:"sans"});
  y+=sw+1;
  const rows=[["Nozzle",range(sp.nMin,sp.nMax),"C"],["Bed",range(sp.bMin,sp.bMax),"C"],["Dry",sp.dT?(sp.dT+" C  "+(sp.dH?sp.dH+" h":"")):"",""]];
  const free=H-m-y, step=Math.min(free/specLines,3.5);
  rows.forEach((r,i)=>{
    const yy=y+step*(i+.8);
    ops.push({t:"text",x,y:yy,text:r[0],pt:7.5,font:"sans",bold:1});
    const v = r[1] ? (r[2]? r[1]+" °"+r[2] : r[1].replace(" C"," °C")) : "-";
    ops.push({t:"text",x:x+11,y:yy,text:v,pt:7.5,font:"sans"});
  });
  return ops;
}
function locOps(l,W,H){
  const m=2.2, ops=[], qs=Math.min(H-2*m,W*.42);
  ops.push({t:"qr",x:m,y:m,s:qs,text:qrUrl("loc-"+l.id)});
  const x=m+qs+2.5, cw=W-x-m;
  const g=!!l.group;
  const a=fit(safe(l.name),cw,20,10,"sans",1);
  ops.push({t:"text",x,y:H/2-(g?.8:-2.2),text:a.text,pt:a.pt,font:"sans",bold:1});
  if(g){ const b=fit(safe(l.group),cw,15,9,"sans",0); ops.push({t:"text",x,y:H/2+6,text:b.text,pt:b.pt,font:"sans"}); }
  return ops;
}
const itemOps = (it,W,H) => it.kind==="loc" ? locOps(it.data,W,H) : spoolOps(it.data,W,H);

function opsToSVG(ops,W,H){
  let o="";
  for(const p of ops){
    if(p.t==="rect") o+=`<rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" fill="${p.fill||"none"}" ${p.stroke?`stroke="${p.stroke}" stroke-width=".15"`:""}/>`;
    if(p.t==="tri") o+=`<polygon points="${p.pts.map(n=>n.toFixed(3)).join(" ")}" fill="${p.fill}" stroke="${p.fill}" stroke-width=".03"/>`;
    if(p.t==="img") o+=`<image x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" href="${esc(p.src)}" preserveAspectRatio="xMinYMin meet"/>`;
    if(p.t==="text"){
      const fam=p.font==="mono"?"Courier New,Courier,monospace":"Helvetica,Arial,sans-serif";
      o+=`<text x="${p.x}" y="${p.y}" font-family="${fam}" font-size="${(p.pt*.3528).toFixed(3)}" font-weight="${p.bold?700:400}" text-anchor="${p.align==="center"?"middle":"start"}" fill="#000">${esc(p.text)}</text>`;
    }
    if(p.t==="qr"){
      const mx=qrMatrix(p.text), n=mx.length, u=p.s/n; let d="";
      mx.forEach((row,r)=>row.forEach((on,c)=>{ if(on) d+=`M${(p.x+c*u).toFixed(3)} ${(p.y+r*u).toFixed(3)}h${u.toFixed(3)}v${u.toFixed(3)}h-${u.toFixed(3)}z`; }));
      o+=`<path d="${d}" fill="#000"/>`;
    }
  }
  return `<svg class="sticker" viewBox="0 0 ${W} ${H}" width="${W*4}" height="${H*4}" role="img" aria-label="Sticker preview"><rect width="${W}" height="${H}" fill="#fff"/>${o}</svg>`;
}
const imgFormat = src => /^data:image\/jpe?g/i.test(src) ? "JPEG" : "PNG";
function opsToPDF(doc,ops,ox,oy){
  for(const p of ops){
    const x=ox+p.x,y=oy+p.y;
    if(p.t==="rect"){
      if(p.fill) doc.setFillColor(p.fill);
      if(p.stroke){ doc.setDrawColor(p.stroke); doc.setLineWidth(.15); }
      doc.rect(x,y,p.w,p.h,p.fill&&p.stroke?"FD":p.stroke?"S":"F");
    }
    if(p.t==="tri"){ const q=p.pts; doc.setFillColor(p.fill); doc.setDrawColor(p.fill); doc.setLineWidth(.03); doc.triangle(ox+q[0],oy+q[1],ox+q[2],oy+q[3],ox+q[4],oy+q[5],"FD"); }
    if(p.t==="img"){ try{ doc.addImage(p.src,imgFormat(p.src),x,y,p.w,p.h,p.key,"FAST"); }catch(e){} }
    if(p.t==="text"){
      doc.setFont(p.font==="mono"?"courier":"helvetica",p.bold?"bold":"normal"); doc.setFontSize(p.pt); doc.setTextColor(0,0,0);
      doc.text(p.text,x,y,{align:p.align==="center"?"center":"left"});
    }
    if(p.t==="qr"){
      const mx=qrMatrix(p.text), n=mx.length, u=p.s/n; doc.setFillColor(0,0,0);
      mx.forEach((row,r)=>{ let c=0; while(c<n){ if(!row[c]){c++;continue;} let e=c; while(e<n&&row[e]) e++; doc.rect(x+c*u,y+r*u,(e-c)*u,u+.012,"F"); c=e; } });
    }
  }
}
function curSheet(){
  const st=S.settings.sheet||{};
  if(st.id==="custom"&&st.custom) return {id:"custom",name:"Custom",...st.custom};
  return SHEETS.find(s=>s.id===st.id)||SHEETS[0];
}
function buildPDF(items,start,opts){
  const sh=curSheet(), doc=new jspdf.jsPDF({unit:"mm",format:"a4",compress:true});
  const per=sh.cols*sh.rows; let i=start%per, page=0;
  for(const it of items){
    const c=i%sh.cols, r=Math.floor(i/sh.cols);
    const x=sh.left+c*sh.px+(opts.nx||0), y=sh.top+r*sh.py+(opts.ny||0);
    opsToPDF(doc,itemOps(it,sh.w,sh.h),x,y);
    if(opts.outline){ doc.setDrawColor(150); doc.setLineWidth(.1); doc.rect(x,y,sh.w,sh.h); }
    i++; if(i>=per && it!==items[items.length-1]){ i=0; page++; doc.addPage("a4"); }
  }
  return {doc,next:i%per};
}

  const timer=setTimeout(()=>{ if(!S.ready){ S.stale=true; render(); } },10000);
  const seen=new Set();
  const sub=(name,key)=>col(name).onSnapshot(snap=>{
    const o={}; snap.docs.forEach(d=>o[d.id]={...d.data(),id:d.id}); S[key]=o;
    if(!snap.metadata.fromCache) seen.add(key);
    if(seen.size>=4){ clearTimeout(timer); S.stale=false; }
    upgradeStorages(seen);
    S.ready=1; dataChanged();
  },e=>{ clearTimeout(timer); S.loadErr=(e&&e.code)||"unknown"; if(S.ready) toast("Lost the link to your stock. Reload the page."); else render(); });
  sub("spools","spools"); sub("locations","locs"); sub("brands","brands"); sub("profiles","profiles");
  db.doc("config/main").onSnapshot(d=>{ S.settings=d.exists?{...d.data()}:{}; if(!d.metadata.fromCache) configSeen=true; upgradeStorages(seen); dataChanged(); },()=>{});
}
/* Older accounts kept one storage per slot. Runs once and folds those into one storage with numbered spaces. */
let configSeen=false, upgraded=false;
function upgradeStorages(seen){
  if(upgraded||seen.size<4||!configSeen) return;
  upgraded=true;
  if(S.settings.layout>=2) return;
  for(const [g,ls] of groups()){
    if(!g||ls.length<2||!ls.every(l=>l.capacity===1)) continue;
    const id=newLocId(g), first=ls[0], moved={}; ls.forEach((l,i)=>moved[l.id]=i+1);
    const doc={name:g,group:"",kind:first.kind,spaces:true,capacity:ls.length,order:first.order,wantLabel:true,...(first.maxC?{maxC:first.maxC}:{})};
    S.locs[id]={...doc,id};
    col("locations").doc(id).set(doc);
    for(const s of Object.values(S.spools)){
      const patch={};
      if(moved[s.loc]){ patch.loc=id; patch.slot=moved[s.loc]; }
      if((s.history||[]).some(h=>moved[h.from]||moved[h.to])) patch.history=s.history.map(h=>({...h,from:moved[h.from]?id:h.from,to:moved[h.to]?id:h.to}));
      if(Object.keys(patch).length) col("spools").doc(s.id).update(patch);
    }
    for(const l of ls) col("locations").doc(l.id).delete();
  }
  saveConfig({layout:2});
}
let dataTimer=null;
function dataChanged(){
  clearTimeout(dataTimer);
  dataTimer=setTimeout(()=>{
    if(!booted){ booted=true; route(true); return; }
    const el=document.activeElement;
    if(S.view==="scan") return;
    if(["add","edit","setup","import","store"].includes(S.view)) { if(S.view==="setup"&&!(el&&el.closest&&el.closest("#main")&&el.matches("input,select,textarea"))) render(); return; }
    if(el&&el.closest&&el.closest("#main")&&el.matches("input[type=text],input[type=number],input[type=search],textarea")) return;
    render();
  },60);
}
const fail = (e,what) => toast(e&&e.code==="resource-exhausted" ? `${what}: the free daily limit is used up. It resets tomorrow.` : e&&e.code==="permission-denied" ? `${what}: sign in again.` : `${what}. Check your signal and try again.`);
async function saveConfig(patch){
  const next={...S.settings,...patch}; S.settings=next;
  try{ await db.doc("config/main").set(next); }catch(e){ fail(e,"Couldn't save that setting"); }
}
function nextIds(n){
  let hi=S.settings.lastId||0;
  for(const id of Object.keys(S.spools)){ const v=parseInt(id.slice(1),10); if(v>hi) hi=v; }
  const out=[]; for(let i=1;i<=n;i++) out.push("s"+String(hi+i).padStart(4,"0"));
  return {ids:out,last:hi+n};
}

/* ---------- moving ---------- */
async function doMove(id,to,opts={}){
  const sp=S.spools[id]; if(!sp) return;
  const from=sp.loc||null, l=S.locs[to], other=opts.swap?S.spools[opts.swap]:null;
  if(from===to){ toast("Already in "+locName(to)); return; }
  const seat=!spaced(l)?null:other?spaceOf(other):freeSpaces(l)[0]??null, oldSeat=spaceOf(sp);
  const patch={loc:to,slot:seat,status:"active",history:[{at:Date.now(),from,to},...(sp.history||[])].slice(0,30)};
  if(l&&l.kind==="dryer") patch.lastDried=Date.now();
  try{
    await col("spools").doc(id).update(patch);
    if(other) await col("spools").doc(other.id).update({loc:from,slot:oldSeat,history:[{at:Date.now(),from:to,to:from},...(other.history||[])].slice(0,30)});
    S.spools[id]={...sp,...patch};
    if(other) S.spools[other.id]={...other,loc:from,slot:oldSeat};
    const hot=hotNote(sp,l), place=spotName(S.spools[id]);
    if(S.view==="scan") Scanner.moved(id,place,hot); else render();
    toast(`${id.toUpperCase()} moved to ${place}.${hot}`,"Undo",async()=>{
      await col("spools").doc(id).update({loc:from,slot:sp.slot??null,status:sp.status||"active",history:sp.history||[],lastDried:sp.lastDried||null});
      if(other) await col("spools").doc(other.id).update({loc:to,slot:other.slot??null,history:other.history||[]});
    });
  }catch(e){ fail(e,"That move didn't save"); }
}
const hotNote = (sp,l) => l&&l.maxC&&sp.dT>l.maxC ? ` It wants ${sp.dT} °C and this dryer stops at ${l.maxC} °C.` : "";
function tryMove(id,to){
  const sp=S.spools[id], l=S.locs[to]; if(!sp||!l) return;
  if(sp.loc===to){ toast("Already in "+locName(to)); return; }
  const place=()=>{
    const here=inLoc(to).filter(s=>s.id!==id);
    if(!l.capacity||here.length<l.capacity){ doMove(id,to); return; }
    if(!spaced(l)&&l.capacity!==1){ ask(`${l.name} is full`,`It holds ${l.capacity}. Move something out first, or raise the limit in Setup.`,[["OK",null]]); return; }
    const out=sp.loc?`It goes to ${locName(sp.loc)}.`:"It will have no storage set.";
    ask(`${l.name} is full`,`Which spool comes out? ${out}`,[...here.map(o=>[`${o.id.toUpperCase()} ${o.material} ${o.colour||""}`.trim(),()=>doMove(id,to,{swap:o.id})]),["Cancel",null]]);
  };
  const hit=warnHit(sp,l);
  if(hit) ask(`${hit} in ${l.name}`,`${sp.material} is on the warning list for ${l.name}. Move it anyway?`,[["Move anyway",place,"go"],["Cancel",null]]);
  else place();
}
function handleScan(code,source){
  if(!code){ toast("That isn't one of your stickers."); return; }
  if(/^s\d+/.test(code)){
    if(!S.spools[code]){ go(code); return; }
    if(source==="page"&&S.view==="scan"){ Scanner.take(code); return; }
    local.set("pending",{id:code,at:Date.now()}); S.scanned=code;
    go(code); return;
  }
  const id=code.replace(/^loc-/,"");
  if(!S.locs[id]){ toast("That storage isn't in the system any more."); return; }
  if(source==="page"&&S.view==="scan"){ Scanner.take(code); return; }
  const p=local.get("pending");
  go(code);
  if(p&&Date.now()-p.at<MOVE_WINDOW&&S.spools[p.id]){ local.del("pending"); tryMove(p.id,id); }
}

/* ---------- routing ---------- */
const VIEWS=["stock","add","scan","stickers","setup","import"];
function go(v){
  internal=true;
  if(location.hash==="#"+v){ internal=false; route(false); return; }
  location.hash=v;
}
addEventListener("hashchange",()=>{ const ext=!internal; internal=false; if(booted) route(ext); });
function route(external){
  const h=location.hash.slice(1).toLowerCase()||"stock";
  if(external&&(/^s\d+/.test(h)||h.startsWith("loc-"))){ S.view=h.startsWith("loc-")?"loc":"spool"; S.param=h.replace(/^loc-/,""); handleArrival(h); return; }
  if(/^s\d+/.test(h)){ S.view="spool"; S.param=h; }
  else if(h.startsWith("edit-")){ S.view="edit"; S.param=h.slice(5); }
  else if(h.startsWith("loc-")){ S.view="loc"; S.param=h.slice(4); }
  else if(h.startsWith("store-")){ S.view="store"; S.param=h.slice(6); storeDraft(S.param); }
  else if(VIEWS.includes(h)){ S.view=h; S.param=null; }
  else { S.view="stock"; S.param=null; }
  if(S.view==="add"&&!F) newDraft();
  if(S.view==="edit") editDraft(S.param);
  render(); try{ scrollTo(0,0); }catch{}
}
function handleArrival(code){
  // a sticker was scanned with the phone's own camera and opened this link
  if(code.startsWith("loc-")){
    const id=code.slice(4), p=local.get("pending");
    render();
    if(p&&Date.now()-p.at<MOVE_WINDOW&&S.spools[p.id]&&S.locs[id]){ local.del("pending"); tryMove(p.id,id); }
  } else {
    if(S.spools[code]) local.set("pending",{id:code,at:Date.now()});
    S.scanned=code; render();
  }
}

/* ---------- views ---------- */
function render(){
  document.querySelectorAll("[data-nav]").forEach(b=>{
    if(b.dataset.nav===S.view||(S.view==="edit"&&b.dataset.nav==="add")) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
  });
  const m=$("#main");
  if(S.view!=="scan") Scanner.stop();
  if(!db){ m.innerHTML=!CFG.firebase?SOURCE_NOTE:!started?`<div class="busy"><span class="spin"></span>Starting up</div>`:vLogin(); return; }
  if(!S.ready&&S.loadErr){ m.innerHTML=`<div class="card"><h2>Can't open your stock</h2><p>${S.loadErr==="permission-denied"?"Firebase refused access. Open Firestore in the Firebase console, go to the Rules tab, paste in firestore.rules and press Publish, then reload this page.":"Firebase gave an error, so reload the page. If it keeps happening, note this code."}</p><p class="mono">${esc(S.loadErr)}</p></div>`; return; }
  if(!S.ready){ m.innerHTML=S.stale?`<div class="note warn">Can't reach your stock yet. Check your signal, it will load when it connects.</div>`:`<div class="busy"><span class="spin"></span>Opening your stock</div>`; return; }
  const v={stock:vStock,add:vForm,edit:vForm,scan:vScan,stickers:vStickers,setup:vSetup,spool:vSpool,loc:vLoc,store:vStore,import:vImport}[S.view]||vStock;
  m.innerHTML=(!navigator.onLine?`<div class="note warn">No signal. Changes are kept on this device and sync when you're back.</div>`:S.stale?`<div class="note warn">Showing your last saved copy. It may be out of date.</div>`:"")+v();
  if(S.view==="scan") Scanner.attach();
  if(S.view==="add"||S.view==="edit") formPreview();
  if(S.view==="store"&&LF) storePreview();
  if(crop) drawCrop();
}

/* live camera scanner: scan a spool, then a storage */
const Scanner={
  stream:null, timer:0, last:"", lastAt:0, held:null, msg:"", canvas:null, det:null,
  say(text,held){ const n=$("#scanState"); if(n){ n.textContent=text; n.classList.toggle("held",!!held); } const o=$("#heldOpen"); if(o) o.hidden=!this.held; },
  attach(){
    this.say(this.msg||"Scan a spool sticker",!!this.held);
    if(this.stream) this.show();
    else if(local.get("camOK")) this.start();
  },
  show(){
    const v=$("#cam"); if(!v) return;
    $("#camWrap").hidden=false; $("#camStart").hidden=true; $("#camStop").hidden=false;
    v.srcObject=this.stream; v.play().catch(()=>{});
    clearInterval(this.timer); this.timer=setInterval(()=>this.tick(),180);
  },
  async start(){
    if(!navigator.mediaDevices?.getUserMedia){ this.say("This browser can't use the camera. Take a photo instead."); return; }
    try{
      this.stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}}});
      local.set("camOK",true);
      if("BarcodeDetector" in window){ try{ this.det=new BarcodeDetector({formats:["qr_code"]}); }catch{} }
      if(S.view==="scan") this.show(); else this.stop();
    }catch(e){ local.del("camOK"); this.say("Camera blocked. Allow it in your settings, or take a photo instead."); }
  },
  stop(){
    clearInterval(this.timer); this.timer=0;
    if(this.stream){ this.stream.getTracks().forEach(t=>t.stop()); this.stream=null; }
    const w=$("#camWrap"); if(w){ w.hidden=true; $("#camStart").hidden=false; $("#camStop").hidden=true; }
  },
  busy:false,
  async tick(){
    const v=$("#cam"); if(!v||v.readyState<2||this.busy||!$("#modal").hidden) return;
    this.busy=true;
    try{
      let raw=null;
      if(this.det){ const r=await this.det.detect(v).catch(()=>[]); raw=r[0]?.rawValue||null; }
      if(!raw&&window.jsQR){
        const c=this.canvas||(this.canvas=document.createElement("canvas")), k=Math.min(1,800/v.videoWidth);
        c.width=v.videoWidth*k|0; c.height=v.videoHeight*k|0;
        const x=c.getContext("2d",{willReadFrequently:true}); x.drawImage(v,0,0,c.width,c.height);
        raw=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height,{inversionAttempts:"dontInvert"})?.data||null;
      }
      if(raw) this.found(raw);
    } finally { this.busy=false; }
  },
  found(raw){
    const code=parseCode(raw), now=Date.now();
    if(!code||(code===this.last&&now-this.lastAt<3000)) return;
    this.last=code; this.lastAt=now;
    try{ navigator.vibrate&&navigator.vibrate(60); }catch{}
    this.take(code);
  },
  take(code){
    if(/^s\d+/.test(code)){
      const sp=S.spools[code];
      if(!sp){ this.msg=`${code.toUpperCase()} isn't in your stock`; this.held=null; this.say(this.msg); return; }
      const target=local.get("scanTarget");
      if(target&&S.locs[target]){ this.held=null; tryMove(code,target); return; }
      this.held=code; this.msg=`${code.toUpperCase()} ${sp.material} ${sp.colour||""}. Now scan a storage`; this.say(this.msg,true);
    } else {
      const id=code.replace(/^loc-/,"");
      if(!S.locs[id]){ this.msg="That storage isn't in the system any more"; this.say(this.msg); return; }
      if(!this.held){ this.msg=`That's ${locName(id)}. Scan a spool first`; this.say(this.msg); return; }
      const h=this.held; this.held=null; tryMove(h,id);
    }
  },
  moved(id,place,note){ this.msg=`${id.toUpperCase()} is in ${place}.${note||""} Scan the next spool`; this.say(this.msg); },
};

function brandOptions(q){
  const seen=new Map(), add=(name,n)=>{ const k=slug(name); if(!seen.has(k)) seen.set(k,{name,n:0}); if(n) seen.get(k).n=n; };
  Object.values(S.brands).forEach(b=>add(b.name)); BRANDS.forEach(b=>add(b)); Object.values(CAT||{}).forEach(c=>add(c.name,c.lines.length));
  const t=norm(q), rank=b=>norm(b.name).startsWith(t)?0:1;
  return [...seen.values()].filter(b=>norm(b.name).includes(t)).sort((a,b)=>rank(a)-rank(b)||a.name.localeCompare(b.name));
}
function lineOptions(brand,q){
  const saved=Object.values(S.profiles).filter(p=>slug(p.brand)===slug(brand)).map(p=>({n:p.material,saved:true,hay:searchText(p.material)}));
  const lines=(catBrand(brand)?.lines||[]).filter(l=>!saved.some(p=>norm(p.n)===norm(l.n)));
  const all=[...saved,...lines];
  return {list:(all.length?all:MATERIALS.map(m=>({n:m.key,hay:searchText(m.key),generic:true}))).filter(l=>matches(l.hay,q)),own:all.length>0};

async function makePDF(){
  const items=queue().filter(i=>!Q.skip.has(i.key)); if(!items.length) return;

  const {doc,next}=buildPDF(items,start,{nx:num(st.nx)||0,ny:num(st.ny)||0,outline:Q.outline});
  try{
    await downloads.save({filename:"spool-stickers.pdf",data:new Blob([doc.output("arraybuffer")],{type:"application/pdf"})});
  }catch(e){ toast("Couldn't save the PDF here. Try from a computer."); return; }
  if(Q.outline){ toast("Test sheet saved. Stickers stay in the queue."); return; }
  try{
    for(const it of items){
      if(it.kind==="spool") await col("spools").doc(it.data.id).update({labelled:true});
      else await col("locations").doc(it.data.id).update({wantLabel:false});
    }
    await saveConfig({sheet:{...st,start:next}});
    toast("Saved. Those stickers are marked as printed.");
  }catch(e){ fail(e,"PDF saved, but the queue didn't update"); }

/* image helpers */
const loadImg = blob => new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(blob); });
function toCanvas(img,max){
  const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
  const c=document.createElement("canvas"); c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k);
  c.getContext("2d",{willReadFrequently:true}).drawImage(img,0,0,c.width,c.height); return c;
}
const canvasBlob = (c,type="image/jpeg",q=.85) => new Promise(r=>c.toBlob(r,type,q));
async function decodeQR(file){
  const img=await loadImg(file);
  if("BarcodeDetector" in window){ try{ const r=await new BarcodeDetector({formats:["qr_code"]}).detect(img); if(r[0]) return r[0].rawValue; }catch{} }
  for(const max of [1400,900,600,2200]){
    const c=toCanvas(img,max), d=c.getContext("2d").getImageData(0,0,c.width,c.height);
    const q=jsQR(d.data,c.width,c.height,{inversionAttempts:"attemptBoth"}); if(q) return q.data;
  }
  return null;
}
const parseCode = t => { const m=/(?:#|^)\s*(s\d{4,}|loc-[a-z0-9-]+)\s*$/i.exec(String(t||"").trim()); return m?m[1].toLowerCase():null; };

/* logo crop */
function openCrop(url,w,h,brand,box,back){
  const bx=(box&&box.length===4&&box.every(v=>typeof v==="number"))?[clamp(box[0],0,1),clamp(box[1],0,1),clamp(box[2],0,1),clamp(box[3],0,1)]:[.1,.1,.9,.45];
  if(bx[2]-bx[0]<.03||bx[3]-bx[1]<.02){ bx[0]=.1;bx[1]=.1;bx[2]=.9;bx[3]=.45; }
  crop={url,w,h,brand,box:bx,back};
}
const cropHTML = () => `<div class="card" id="cropCard"><h2>${esc(crop.brand)} logo</h2><p>Drag a box round the logo. It goes on every ${esc(crop.brand)} sticker.</p>
  <div class="cropwrap"><div class="crop" id="cropBox"><img src="${esc(crop.url)}" alt="Photo to crop"><i id="cropRect"></i></div></div>

/* turns any logo into solid black on a transparent background, keeping soft edges so it prints smoothly */
function blackLogo(ctx,w,h){
  const im=ctx.getImageData(0,0,w,h), d=im.data;
  let see=0; for(let i=3;i<d.length;i+=4) if(d[i]<128) see++;
  if(see>(w*h)*.05){
    for(let i=0;i<d.length;i+=4){ const lum=d[i]*.3+d[i+1]*.59+d[i+2]*.11, keep=lum>245?0:d[i+3]; d[i]=d[i+1]=d[i+2]=0; d[i+3]=keep; }
  } else {
    const hist=new Array(256).fill(0);
    for(let i=0;i<d.length;i+=4){ const a=d[i+3]/255, v=(d[i]*.3+d[i+1]*.59+d[i+2]*.11)*a+255*(1-a); d[i]=v; hist[v|0]++; }
    let total=w*h,sum=0,sb=0,wb=0,best=0,th=128; for(let i=0;i<256;i++) sum+=i*hist[i];
    for(let i=0;i<256;i++){ wb+=hist[i]; if(!wb) continue; const wf=total-wb; if(!wf) break; sb+=i*hist[i]; const mb=sb/wb,mf=(sum-sb)/wf,v=wb*wf*(mb-mf)*(mb-mf); if(v>best){best=v;th=i;} }
    let dark=0; for(let i=0;i<=th;i++) dark+=hist[i];
    const inv=dark>total/2, soft=14;
    for(let i=0;i<d.length;i+=4){ const v=d[i], a=clamp((inv?v-th:th-v)/soft+.5,0,1); d[i]=d[i+1]=d[i+2]=0; d[i+3]=Math.round(a*255); }
  }
  ctx.putImageData(im,0,0);
}
function trimWhite(c){
  const ctx=c.getContext("2d"),{width:w,height:h}=c,d=ctx.getImageData(0,0,w,h).data;
  let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const i=(y*w+x)*4; if(d[i+3]>40){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } }
  if(x1<0) return null;
  const o=document.createElement("canvas"); o.width=x1-x0+1; o.height=y1-y0+1; o.getContext("2d").drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height); return o;
}
async function saveLogo(){

  const [a,b,c,d]=crop.box, W=img.naturalWidth,H=img.naturalHeight;

  const cv=document.createElement("canvas"); cv.width=Math.round(sw*k); cv.height=Math.round(sh*k);

const logoData = b => b&&b.logo ? {src:b.logo,w:b.logoW,h:b.logoH,key:"logo-"+slug(b.name)} : null;
const loadCross = url => new Promise((res,rej)=>{ const i=new Image(); i.crossOrigin="anonymous"; i.onload=()=>res(i); i.onerror=()=>rej(new Error("blocked")); i.src=url; });
function inkCanvas(source,w,h){
  const k=Math.min(1600/Math.max(w,h),1), c=document.createElement("canvas"); c.width=Math.max(1,Math.round(w*k)); c.height=Math.max(1,Math.round(h*k));

async function svgInk(text){
  const el=new DOMParser().parseFromString(text,"image/svg+xml").documentElement;

  const vb=(el.getAttribute("viewBox")||"").trim().split(/[\s,]+/).map(Number);
  const w=vb.length===4?vb[2]:parseFloat(el.getAttribute("width"))||100, h=vb.length===4?vb[3]:parseFloat(el.getAttribute("height"))||100, k=1600/Math.max(w,h);
  el.setAttribute("width",w*k); el.setAttribute("height",h*k);

  return inkCanvas(img,w*k,h*k);
}

async function wikiCandidates(name){

      const id=newLocId(label), doc={...body,name:label,order:++order,wantLabel:true};
      S.locs[id]={...doc,id}; col("locations").doc(id).set(doc);
    }
    toast(n===1?`${name} added. Its sticker is in the queue.`:`${n} storages added. Their stickers are in the queue.`);
  } else {
    const held=inLoc(LF.id).length, old=S.locs[LF.id];
    if(cap&&held>cap){ toast(`It has ${held} spools in it, so it needs room for at least ${held}.`); return; }
    const renamed=old.name!==name||(old.group||"")!==body.group;
    col("locations").doc(LF.id).update(renamed?{...body,wantLabel:true}:body);
    toast(renamed?"Saved. Its sticker is back in the queue.":"Saved.");
  }
  LF=null; go("setup");
}

/* ---------- modal + toast ---------- */
let toastT=null;
function toast(msg,label,fn){
  const t=$("#toast"); t.hidden=false; t.innerHTML=`<span>${esc(msg)}</span>`;
  if(label){ const b=document.createElement("button"); b.textContent=label; b.onclick=()=>{ t.hidden=true; fn&&fn(); }; t.append(b); }
  clearTimeout(toastT); toastT=setTimeout(()=>{ t.hidden=true; },label?9000:4500);
}
function ask(title,msg,btns){
  const m=$("#modal"); m.hidden=false;
  m.innerHTML=`<div role="dialog" aria-modal="true"><h2>${esc(title)}</h2><p>${esc(msg)}</p><div class="btns" id="askBtns"></div></div>`;
  btns.forEach(([t,fn,cls])=>{ const b=document.createElement("button"); b.className="btn "+(cls||""); b.textContent=t; b.onclick=()=>{ m.hidden=true; fn&&fn(); }; $("#askBtns").append(b); });
}

/* ---------- events ---------- */
const actions={
  async authCreate(){ const e=$("#authEmail").value.trim(), p=$("#authPass").value; try{ await firebase.auth().createUserWithEmailAndPassword(e,p); }catch(x){ authErr(x); } },
  async authReset(){ const e=$("#authEmail").value.trim(); if(!e){ toast("Type your email first."); return; } try{ await firebase.auth().sendPasswordResetEmail(e); toast("Reset email sent."); }catch(x){ authErr(x); } },
  async signOut(){ await firebase.auth().signOut(); location.hash=""; location.reload(); },
  importPaste(){ try{ Imp=parseImport($("#importText").value); render(); }catch(m){ const n=$("#importErr"); n.hidden=false; n.textContent=m; } },
  importGo(){ const l=$("#importLoc"); Imp.loc=l?l.value:""; runImport(); },
  importCancel(){ Imp=null; render(); },
  logoFind(el){ openPicker(el.dataset.v); },
  logoClose(){ P=null; render(); },
  async logoUse(el){
    const c=P.items[+el.dataset.v], name=P.name; const ok=await useCandidate(name,c);
    if(ok){ P=null; toast(name+" logo saved."); render(); } else toast("That image wouldn't load here. Try another, or save it and upload it.");
  },
  async logosAll(){
    const todo=Object.values(S.brands).filter(b=>!logoData(b)); let n=0;
    for(const b of todo) if(await autoLogo(b.name)) n++;
    const left=todo.length-n; toast(left?`Found ${n}. ${left} still need one, so press Find logo on those.`:`Found ${n}.`); render();
  },
  async listCopy(){ try{ await navigator.clipboard.writeText(stockExport()); toast("Stock list copied."); }catch{ toast("Couldn't copy here. Use Download instead."); } },
  listSave(){ saveFile("spool-stock-list.json",stockExport()); },
  camStart(){ Scanner.start(); },
  camStop(){ Scanner.stop(); local.del("camOK"); },
  heldOpen(){ const h=Scanner.held; if(h) go(h); },
  tab(el){ S.filter.tab=el.dataset.v; render(); },
  mat(el){ S.filter.mat=S.filter.mat===el.dataset.v?"":el.dataset.v; render(); },
  move(el){ tryMove(S.param,el.dataset.loc); },
  async saveRemain(){
    const s=S.spools[S.param], sc=num($("#scaleG").value); let v=num($("#remG").value);
    if(sc!=null){ if(!s.tareG){ toast("Set the empty spool weight first, using Edit."); return; } v=Math.max(0,sc-s.tareG); }
    if(v==null) return;
    try{ await col("spools").doc(s.id).update({remainG:Math.round(v)}); toast("Weight saved."); document.activeElement?.blur(); render(); }catch(e){ fail(e,"That weight didn't save"); }
  },
  async usedUp(){
    const s=S.spools[S.param], used=s.status==="used";
    await col("spools").doc(s.id).update(used?{status:"active"}:{status:"used",loc:null,slot:null});
    toast(used?"Back in stock.":`${s.id.toUpperCase()} marked used up.`,used?null:"Undo",()=>col("spools").doc(s.id).update({status:"active",loc:s.loc,slot:s.slot??null}));
  },
  async reprint(){ await col("spools").doc(S.param).update({labelled:false}); toast("Sticker added to the queue."); },
  async printLoc(){ await col("locations").doc(S.param).update({wantLabel:true}); toast("Storage sticker added to the queue."); },
  async printAllLocs(){ for(const l of orderedLocs()) await col("locations").doc(l.id).update({wantLabel:true}); toast("All storage stickers added to the queue."); },
  delSpool(){
    const s=S.spools[S.param];
    ask(`Delete ${s.id.toUpperCase()}?`,"This removes it completely. If it has just run out, Mark used up keeps the record.",[["Delete",async()=>{ await col("spools").doc(s.id).delete(); toast("Deleted."); go("stock"); },"bad"],["Cancel",null]]);
  },
  hex(el){ F.hex=el.dataset.v; F.colours[0]=F.hex; F.hexTouched=true; const h=$("#f_hex"); if(h) h.value=F.hex; formPreview(); },
  colourAdd(){ readForm(); F.colours.push("#FFFFFF"); $("#colourRow").innerHTML=colourRow(); formPreview(); },
  colourDrop(){ readForm(); F.colours.pop(); $("#colourRow").innerHTML=colourRow(); formPreview(); },
  logoFor(el){ pendingLogo=el.dataset.v; },
  codeGo(){ const c=parseCode($("#codeIn").value); if(c) handleScan(c,"code"); else toast("Codes look like S0012."); },
  pick(el){ if(el.checked) Q.skip.delete(el.dataset.v); else Q.skip.add(el.dataset.v); render(); },
  cell(el){ saveConfig({sheet:{...(S.settings.sheet||{}),start:parseInt(el.dataset.v)}}); render(); },
  pdf(){ makePDF(); },
  pickBrand(el){
    const b=Picks.brands[+el.dataset.v]; if(!b) return;
    F.brand=b.name; $("#f_brand").value=b.name; hidePicks();
    if(F.src==="edited"||F.src==="label") F.touched=false;
    refreshLookup(); const m=$("#f_material"); m.focus(); showPicks("f_material");
  },
  pickLine(el){
    const l=Picks.lines[+el.dataset.v]; if(!l) return;
    F.material=l.n; $("#f_material").value=l.n; F.touched=false; hidePicks(); document.activeElement?.blur();
    if(l.w){ F.netG=l.w; $("#f_netG").value=l.w; }
    if(l.s!=null){ F.tareG=l.s; $("#f_tareG").value=l.s; }
    if(l.f){ F.finish=l.f; $("#f_finish").value=l.f; }
    refreshLookup();
  },
  catColour(el){ const c=catLine(F.brand,F.material)?.c[+el.dataset.v]; if(c) useColour(c); },
  storeCancel(){ LF=null; go("setup"); },
  storeDel(){
    const l=S.locs[LF.id], here=inLoc(l.id);
    ask(`Delete ${l.name}?`,here.length?`${here.length} spool${here.length===1?"":"s"} in it will have no storage set. Its sticker stops working.`:"Its sticker stops working.",[["Delete",async()=>{ for(const s of here) await col("spools").doc(s.id).update({loc:null,slot:null}); await col("locations").doc(l.id).delete(); LF=null; toast(l.name+" deleted."); go("setup"); },"bad"],["Cancel",null]]);
  },
  storesClear(){
    ask("Remove all storages?","Your spools stay in stock with no storage set. Any storage stickers you've printed stop working.",[["Remove all",async()=>{ for(const s of Object.values(S.spools)) if(s.loc) await col("spools").doc(s.id).update({loc:null,slot:null}); for(const id of Object.keys(S.locs)) await col("locations").doc(id).delete(); toast("Storages removed."); render(); },"bad"],["Cancel",null]]);
  },
  async storeShift(el){
    const ls=orderedLocs(), i=ls.findIndex(l=>l.id===el.dataset.v), j=i+ +el.dataset.d; if(j<0||j>=ls.length) return;
    [ls[i],ls[j]]=[ls[j],ls[i]];
    ls.forEach((l,n)=>{ if(l.order!==n+1){ S.locs[l.id].order=n+1; col("locations").doc(l.id).update({order:n+1}); } });
    render();
  },
  spacePick(el){
    const s=S.spools[S.param], n=+el.dataset.v, l=S.locs[s.loc], mine=spaceOf(s), other=seated(l)[n-1];
    if(n===mine) return;
    col("spools").doc(s.id).update({slot:n}); S.spools[s.id].slot=n;
    if(other){ col("spools").doc(other.id).update({slot:mine}); S.spools[other.id].slot=mine; }
    render();
  },
  cropSave(){ saveLogo(); },
  cropSkip(){ crop=null; render(); },
  async csv(){
    const h=["code","manufacturer","material","colour","hex","finish","storage","remaining_g","net_g","nozzle","bed","status"];
    const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
    const rows=Object.values(S.spools).sort((a,b)=>a.id.localeCompare(b.id)).map(s=>[s.id,s.brand,s.material,s.colour,s.hex,s.finish,s.status==="used"?"Used up":spotName(s),s.remainG,s.netG,range(s.nMin,s.nMax),range(s.bMin,s.bMax),s.status].map(q).join(","));
    saveFile("spool-stock.csv",[h.join(","),...rows].join("\n"));
  },
  async json(){
    saveFile("spool-stock-backup.json",JSON.stringify({saved:new Date().toISOString(),spools:S.spools,locations:S.locs,brands:S.brands,profiles:S.profiles,config:S.settings},null,1));
  },
};
let pendingLogo=null;
async function saveFile(filename,data){
  try{ await downloads.save({filename,data}); }catch(e){ toast(e&&e.code==="app"?"Download this from your PC or a browser.":"Couldn't save that file here."); }
}
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]"); if(g){ e.preventDefault(); if(F&&F.editId&&S.view==="edit"&&g.dataset.go!==S.view) F=null; go(g.dataset.go); return; }
  const a=e.target.closest("[data-act]"); if(a&&a.dataset.act!=="pick"&&actions[a.dataset.act]) actions[a.dataset.act](a);
});
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.act==="pick"){ actions.pick(t); return; }
  if(t.id==="scanTarget"){ if(t.value) local.set("scanTarget",t.value); else local.del("scanTarget"); return; }
  if(t.id==="sheetSel"){ const st={...(S.settings.sheet||{}),id:t.value,start:0}; if(t.value==="custom"&&!st.custom) st.custom={w:63.5,h:38.1,cols:3,rows:7,left:7.25,top:15.15,px:66,py:38.1}; await saveConfig({sheet:st}); render(); return; }
  if(t.id&&t.id.startsWith("cu_")){ const st=S.settings.sheet||{}, c={...(st.custom||{})}; c[t.id.slice(3)]=num(t.value)||0; await saveConfig({sheet:{...st,custom:c}}); render(); return; }
  if(t.id==="nudgeX"||t.id==="nudgeY"){ const st=S.settings.sheet||{}; await saveConfig({sheet:{...st,[t.id==="nudgeX"?"nx":"ny"]:num(t.value)||0}}); return; }
  if(t.id==="outline"){ Q.outline=t.checked; return; }
  if(t.name==="s_kind"){ readStore(); Object.assign(LF,storeDefaults(t.value)); render(); return; }
  if(t.id==="s_spaces"){ readStore(); render(); return; }
  if(t.id==="pickScan"&&t.files[0]){
    const f=t.files[0]; t.value="";
    const out=$("#scanOut"); if(out){ out.hidden=false; out.innerHTML=`<div class="busy"><span class="spin"></span>Reading the sticker</div>`; }
    const raw=await decodeQR(f).catch(()=>null); if(out){ out.hidden=true; out.innerHTML=""; }
    const code=parseCode(raw);
    if(code) handleScan(code,"page"); else toast(raw?"That code isn't one of your stickers.":"Couldn't find a code in that photo. Get closer and try again.");
    return;
  }
  if(t.id==="pickImport"&&t.files[0]){ const f=t.files[0]; t.value=""; try{ Imp=parseImport(await f.text()); render(); }catch(m){ toast(String(m)); } return; }
  if(t.dataset&&t.dataset.imp!=null&&Imp){ const it=Imp.items.find(i=>String(i.key)===t.dataset.imp); if(it) it.on=t.checked; const l=$("#importLoc"); Imp.loc=l?l.value:""; render(); return; }
  if(t.id==="pickLogo"&&t.files[0]){
    const f=t.files[0]; t.value=""; if(S.view==="add"||S.view==="edit") readForm();
    if(/svg/.test(f.type)){ const cv=await svgInk(await f.text()).catch(()=>null); if(cv&&await storeInk(pendingLogo,cv,{from:"Your vector"})){ P=null; toast(pendingLogo+" logo saved."); render(); } else toast("That vector file wouldn't open."); return; }
    const img=await loadImg(f), c=toCanvas(img,1600), blob=await canvasBlob(c,"image/png");
    P=null; openCrop(URL.createObjectURL(blob),c.width,c.height,pendingLogo||"Logo",[0,0,1,1],S.view); render(); return;
  }
});
document.addEventListener("focusin",e=>{ if(F&&(e.target.id==="f_brand"||e.target.id==="f_material")){ hidePicks(); showPicks(e.target.id); } });
document.addEventListener("focusout",e=>{ if(e.target.id==="f_brand"||e.target.id==="f_material") setTimeout(()=>{ const a=document.activeElement; if(!(a&&(a.id==="f_brand"||a.id==="f_material"))) hidePicks(); },150); });
document.addEventListener("mousedown",e=>{ if(e.target.closest&&e.target.closest(".picks")) e.preventDefault(); });
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id&&t.id.startsWith("s_")&&LF){ readStore(); storePreview(); return; }
  if(t.dataset&&t.dataset.colour&&F){ F.colours[+t.dataset.colour]=t.value; formPreview(); return; }
  if(t.id==="q"){ S.filter.q=t.value; const box=$("#spoolList"); if(box) box.innerHTML=stockRows(); return; }
  if(t.id&&t.id.startsWith("f_")&&F){
    readForm();
    if(["f_nMin","f_nMax","f_bMin","f_bMax","f_dT","f_dH"].includes(t.id)){ F.touched=true; F.src="edited"; formPreview(); }
    else if(t.id==="f_hex"){ F.hexTouched=true; formPreview(); }
    else if(t.id==="f_pattern"){ if(F.pattern!=="solid"&&F.colours.length<2) F.colours.push("#FFFFFF"); $("#colourRow").innerHTML=colourRow(); formPreview(); }
    else if(t.id==="f_colour"){
      const known=catLine(F.brand,F.material)?.c.find(c=>norm(c[0])===norm(F.colour));
      if(known){ useColour(known); return; }
      const n=F.hexTouched?null:NAMED.find(([re])=>re.test(F.colour));
      if(n){ F.hex=n[1]; F.colours[0]=n[1]; const h=$("#f_hex"); if(h) h.value=n[1]; }
      formPreview();
    }
    else if(t.id==="f_brand"||t.id==="f_material"){ if(F.src==="edited"||F.src==="label"){ F.touched=false; } showPicks(t.id); refreshLookup(); }
    else formPreview();
  }
});
function stockRows(){
  const f=S.filter,q=f.q.toLowerCase(), live=liveSpools();
  const rows=(f.tab==="used"?Object.values(S.spools).filter(s=>s.status==="used"):live).filter(s=>{
    if(f.tab==="low"&&!isLow(s)) return false;
    if(f.mat&&(baseMat(s.material)?.key||s.material)!==f.mat) return false;
    if(q&&![s.id,s.brand,s.material,s.colour,s.finish,spotName(s)].join(" ").toLowerCase().includes(q)) return false;
    return true;
  }).sort((a,b)=>a.id.localeCompare(b.id));
  return rows.map(rowHTML).join("")||emptyList(live.length);
}
document.addEventListener("submit",async e=>{
  e.preventDefault();
  if(e.target.id==="spoolForm") submitForm();
  if(e.target.id==="storeForm") saveStore();
  if(e.target.id==="authForm"){ try{ await firebase.auth().signInWithEmailAndPassword($("#authEmail").value.trim(),$("#authPass").value); }catch(x){ authErr(x); } }
});
for(const ev of ["online","offline"]) addEventListener(ev,()=>{ if(db&&!["add","edit","scan","setup","store"].includes(S.view)) render(); });
addEventListener("paste",e=>{
  const f=[...(e.clipboardData?.files||[])].find(x=>x.type.startsWith("image/")); if(!f) return;
  if((S.view==="add"||S.view==="edit")&&F&&F.brand){ pendingLogo=F.brand; readForm(); const dt=new DataTransfer(); dt.items.add(f); const p=$("#pickLogo"); p.files=dt.files; p.dispatchEvent(new Event("change",{bubbles:true})); }
});
/* crop dragging */
document.addEventListener("pointerdown",e=>{
  const b=e.target.closest&&e.target.closest("#cropBox"); if(!b||!crop) return;
  const r=b.getBoundingClientRect(), pos=ev=>[clamp((ev.clientX-r.left)/r.width,0,1),clamp((ev.clientY-r.top)/r.height,0,1)], s=pos(e);
  b.setPointerCapture(e.pointerId);
  const mv=ev=>{ const p=pos(ev); crop.box=[Math.min(s[0],p[0]),Math.min(s[1],p[1]),Math.max(s[0],p[0]),Math.max(s[1],p[1])]; drawCrop(); };
  const up=()=>{ b.removeEventListener("pointermove",mv); b.removeEventListener("pointerup",up); };
  b.addEventListener("pointermove",mv); b.addEventListener("pointerup",up);
});

/* ---------- start ---------- */
(async()=>{
  render();
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
  if(!CFG.firebase||!window.firebase){ started=true; render(); return; }
  firebase.initializeApp(CFG.firebase);
  fs=firebase.firestore();
  try{ fs.settings({ignoreUndefinedProperties:true}); }catch{}
  try{ await Promise.race([fs.enablePersistence({synchronizeTabs:true}),new Promise(res=>setTimeout(res,4000))]); }catch{}
  started=true; render();
  firebase.auth().onAuthStateChanged(u=>{
    if(!u){ uid=null; db=null; render(); return; }
    if(uid===u.uid) return;
    uid=u.uid;
    const base=`users/${uid}/`;
    db={collection:n=>wrapCol(fs.collection(base+n)),doc:p=>wrapDoc(fs.doc(base+p))};
    render(); watch();
  });
})();
</script>
