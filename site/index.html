<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spool Stock</title>
<meta name="theme-color" content="#FFC800">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a workshop stock board. Storages are drawn as racks of spools, the filament colour and remaining weight drive the graphics, yellow marks the action. */
:root {
  --bg: #e8ecee;
  --panel: #f8fafb;
  --panel2: #dfe5e8;
  --ink: #161c20;
  --muted: #55626a;
  --line: #c4ced3;
  --tag: #ffc800;
  --tag-ink: #161c20;
  --good: #17764a;
  --warn: #a85600;
  --bad: #b3261e;
  --disp: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101518;
    --panel: #192126;
    --panel2: #232d33;
    --ink: #e9eff2;
    --muted: #9ba9b1;
    --line: #303c43;
    --good: #4cc38a;
    --warn: #f0a94b;
    --bad: #f2857c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101518;
  --panel: #192126;
  --panel2: #232d33;
  --ink: #e9eff2;
  --muted: #9ba9b1;
  --line: #303c43;
  --good: #4cc38a;
  --warn: #f0a94b;
  --bad: #f2857c;
  color-scheme: dark;
}
[hidden] {
  display: none !important;
}
/* The jw_ maker's mark at the foot of Setup: dark tile, light letters, the tag yellow for the cursor */
.maker {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin: 18px 0 6px;
  font: 600 12px var(--mono);
  color: var(--muted);
}
.jwmark {
  width: 22px;
  height: 22px;
  flex: none;
}
.jwmark .t {
  fill: #161c20;
  stroke: var(--line);
  stroke-width: 10;
}
.jwmark .l {
  fill: #e9eff2;
}
.jwmark .c {
  fill: var(--tag);
}
html {
  padding-top: env(safe-area-inset-top, 0px);
}
body {
  margin: 0;
}
img {
  max-width: 100%;
}
* {
  box-sizing: border-box;
}
a.btn {
  text-decoration: none;
}
html,
body {
  height: 100%;
}
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.45 var(--body);
  -webkit-tap-highlight-color: transparent;
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
h1,
h2,
h3 {
  font-family: var(--disp);
  font-weight: 700;
  letter-spacing: 0.01em;
  line-height: 1.1;
  margin: 0;
  text-wrap: balance;
}
h1 {
  font-size: 30px;
}
h2 {
  font-size: 22px;
}
h3 {
  font-size: 18px;
}
p {
  margin: 0;
}
.mono {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
}
.muted {
  color: var(--muted);
}
.shell {
  display: grid;
  grid-template-columns: 1fr;
  grid-template-rows: auto 1fr;
  min-height: 100%;
}
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line);
  background: var(--panel);
}
.brand {
  font: 700 21px/1 var(--disp);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  background: var(--tag);
  color: var(--tag-ink);
  padding: 5px 9px 4px;
  border: 0;
  cursor: pointer;
}
.main {
  padding-block: 16px 112px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  gap: 18px;
  align-content: start;
  min-width: 0;
  max-width: 1180px;
  width: 100%;
  margin-inline: auto;
}
.nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 20;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  background: var(--panel);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}
.nav button {
  background: none;
  border: 0;
  padding: 9px 2px 8px;
  display: grid;
  justify-items: center;
  gap: 2px;
  font: 600 15px/1 var(--disp);
  letter-spacing: 0.03em;
  color: var(--muted);
  cursor: pointer;
}
.nav button svg {
  width: 22px;
  height: 22px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.nav button[aria-current="page"] {
  color: var(--ink);
  box-shadow: inset 0 3px 0 var(--tag);
}
.nav .scan {
  color: var(--tag-ink);
  background: var(--tag);
}
.nav .scan[aria-current="page"] {
  color: var(--tag-ink);
  box-shadow: none;
}
@media (min-width: 860px) {
  .shell {
    grid-template-columns: 150px 1fr;
    grid-template-rows: auto 1fr;
  }
  .top {
    grid-column: 1/-1;
  }
  .nav {
    position: sticky;
    top: 0;
    align-self: start;
    grid-template-columns: 1fr;
    border-top: 0;
    border-right: 0;
    background: none;
    padding: 14px 0 0 max(16px, env(safe-area-inset-left, 0px));
  }
  .nav button {
    grid-template-columns: 24px 1fr;
    justify-items: start;
    align-items: center;
    gap: 8px;
    padding: 10px;
    font-size: 17px;
  }
  .nav button[aria-current="page"] {
    box-shadow: inset 3px 0 0 var(--tag);
  }
  .main {
    padding-bottom: 40px;
  }
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 44px;
  padding: 9px 14px;
  border: 1px solid var(--line);
  background: var(--panel);
  font-weight: 600;
  cursor: pointer;
  text-align: center;
  border-radius: 2px;
}
.btn.go {
  background: var(--tag);
  color: var(--tag-ink);
  border-color: var(--tag);
}
.btn.bad {
  color: var(--bad);
  border-color: var(--bad);
  background: none;
}
.btn.sm {
  min-height: 36px;
  padding: 5px 10px;
  font-size: 15px;
}
.btn:disabled {
  opacity: 0.5;
  cursor: default;
}
.btn:focus-visible,
.nav button:focus-visible,
.slot:focus-visible,
.row:focus-visible,
.cell:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}
.btns {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  padding: 14px;
  display: grid;
  gap: 12px;
  min-width: 0;
}
.field {
  display: grid;
  gap: 4px;
  min-width: 0;
}
.field > span,
.lab {
  font-size: 14px;
  font-weight: 600;
  color: var(--muted);
}
input[type="text"],
input[type="number"],
input[type="search"],
select,
textarea {
  width: 100%;
  min-height: 44px;
  padding: 8px 10px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 2px;
  min-width: 0;
}
input[type="color"] {
  width: 44px;
  height: 44px;
  padding: 2px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 2px;
}
.g2 {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  align-items: end;
}
.g4 {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  align-items: end;
}
@media (min-width: 560px) {
  .g4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}
.split {
  display: grid;
  gap: 16px;
  grid-template-columns: 1fr;
}
@media (min-width: 760px) {
  .split {
    grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
    align-items: start;
  }
}
/* racks */
.summary {
  font: 600 19px/1.2 var(--disp);
  letter-spacing: 0.02em;
}
.racks {
  display: grid;
  gap: 12px;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
}
.rack {
  background: var(--panel);
  border: 1px solid var(--line);
  padding: 10px;
  display: grid;
  gap: 8px;
  align-content: start;
  min-width: 0;
}
.rack h3 {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  align-items: baseline;
}
.rackname {
  background: none;
  border: 0;
  padding: 0;
  font: inherit;
  letter-spacing: inherit;
  text-align: left;
  cursor: pointer;
  overflow-wrap: anywhere;
  min-width: 0;
}
.grouphead {
  margin-bottom: -8px;
}
.slots {
  display: grid;
  grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr));
  gap: 6px;
}
.slot {
  background: var(--bg);
  border: 1px solid var(--line);
  padding: 6px 2px 5px;
  display: grid;
  justify-items: center;
  gap: 2px;
  cursor: pointer;
  min-width: 0;
}
.slot .disc {
  max-width: 100%;
  height: auto;
}
.slot small {
  font: 500 12px/1 var(--mono);
}
.slot.empty {
  border-style: dashed;
}
.shelf {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  min-height: 44px;
  cursor: pointer;
  background: var(--bg);
  border: 1px solid var(--line);
  padding: 6px;
  width: 100%;
  text-align: left;
}
.disc {
  display: block;
  flex: none;
}
.disc .fl {
  fill: var(--panel2);
  stroke: var(--muted);
  stroke-width: 2;
}
.disc .hub {
  fill: var(--panel);
  stroke: var(--muted);
  stroke-width: 2;
}
.disc .hole {
  fill: var(--bg);
  stroke: var(--muted);
  stroke-width: 2;
}
.disc .fil {
  stroke: rgba(0, 0, 0, 0.28);
  stroke-width: 1;
}
/* list */
.tools {
  display: grid;
  gap: 8px;
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.chip {
  border: 1px solid var(--line);
  background: var(--panel);
  padding: 5px 10px;
  min-height: 34px;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  border-radius: 2px;
}
.chip[aria-pressed="true"] {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
}
.list {
  display: grid;
  gap: 6px;
}
.row {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  background: var(--panel);
  border: 1px solid var(--line);
  padding: 8px 10px;
  width: 100%;
  text-align: left;
  cursor: pointer;
}
.row b {
  font-weight: 600;
  display: block;
  overflow-wrap: anywhere;
}
.row .sub {
  display: block;
  color: var(--muted);
  font-size: 15px;
  overflow-wrap: anywhere;
}
.row .end {
  text-align: right;
  font-size: 14px;
  line-height: 1.25;
}
.pill {
  display: inline-block;
  font: 600 13px/1 var(--body);
  padding: 3px 6px;
  border: 1px solid currentColor;
  border-radius: 2px;
  white-space: nowrap;
}
.pill.low {
  color: var(--warn);
}
.pill.ex {
  color: var(--muted);
}
.pill.good {
  color: var(--good);
}
.bar {
  height: 6px;
  background: var(--panel2);
  overflow: hidden;
}
.bar i {
  display: block;
  height: 100%;
  background: var(--ink);
}
.bar.low i {
  background: var(--warn);
}
/* spool page */
.spoolhead {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 14px;
  align-items: center;
}
.code {
  font: 600 15px/1 var(--mono);
  letter-spacing: 0.04em;
}
.spec {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px 16px;
}
.spec div {
  min-width: 0;
}
.spec dt {
  font-size: 14px;
  font-weight: 600;
  color: var(--muted);
}
.spec dd {
  margin: 0;
  font-family: var(--mono);
  font-size: 15px;
}
.movegroup {
  display: grid;
  gap: 6px;
}
.movegrid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 6px;
}
.useRow {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 10px;
  align-items: start;
}
.useRow ~ .useRow {
  border-top: 1px solid var(--line);
  padding-top: 10px;
}
.useRow .sw {
  cursor: default;
}
.dropping {
  outline: 3px dashed var(--tag);
  outline-offset: -6px;
}
.arrange {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
  gap: 6px;
}
.arr {
  display: grid;
  justify-items: center;
  gap: 3px;
  padding: 8px 4px 6px;
  background: var(--bg);
  border: 1px solid var(--line);
  cursor: pointer;
  min-width: 0;
  font: inherit;
}
.arr small {
  font: 500 12px/1.1 var(--mono);
  color: var(--muted);
}
.arr.empty {
  border-style: dashed;
}
.arr.end {
  border-style: dashed;
  align-content: center;
  min-height: 76px;
}
.arr[aria-pressed="true"] {
  background: var(--tag);
  border-color: var(--tag-ink);
  color: var(--tag-ink);
}
.arr[aria-pressed="true"] small {
  color: inherit;
}
.spacegrid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(68px, 1fr));
  gap: 6px;
}
.move {
  min-height: 52px;
  display: grid;
  gap: 1px;
  align-content: center;
  justify-items: start;
  text-align: left;
  background: var(--bg);
  border: 1px solid var(--line);
  padding: 6px 9px;
  cursor: pointer;
  font-weight: 600;
}
.move small {
  font-weight: 400;
  color: var(--muted);
  font-size: 14px;
  overflow-wrap: anywhere;
}
.move[aria-current="true"] {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
}
.move[aria-current="true"] small {
  color: inherit;
}
.note {
  border-left: 4px solid var(--tag);
  background: var(--panel);
  padding: 9px 12px;
}
.note.warn {
  border-left-color: var(--warn);
}
.hist {
  display: grid;
  gap: 3px;
  font-size: 15px;
}
.jobrow {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding: 4px 0;
  border-top: 1px solid var(--line);
}
.jobrow span {
  min-width: 0;
}
/* stickers */
.sticker {
  background: #fff;
  border: 1px solid var(--line);
  display: block;
  max-width: 100%;
  height: auto;
}
.sheetmap {
  display: grid;
  gap: 2px;
  background: var(--panel2);
  padding: 6px;
  max-width: 300px;
  width: 100%;
}
.cell {
  aspect-ratio: var(--ar);
  background: var(--panel);
  border: 1px solid var(--line);
  cursor: pointer;
  padding: 0;
  min-width: 0;
}
.cell.used {
  background: repeating-linear-gradient(45deg, var(--panel2), var(--panel2) 3px, var(--bg) 3px, var(--bg) 6px);
}
.cell.next {
  background: var(--tag);
  border-color: var(--tag-ink);
}
.check {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 10px;
  align-items: center;
  background: var(--panel);
  border: 1px solid var(--line);
  padding: 8px;
}
.tiles {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 6px;
}
.tile {
  position: relative;
  display: block;
  cursor: pointer;
  min-width: 0;
}
.tile input {
  position: absolute;
  top: 4px;
  right: 4px;
  width: 22px;
  height: 22px;
  margin: 0;
}
.tile .sticker {
  width: 100%;
}
.tile:has(input:not(:checked)) .sticker {
  opacity: 0.35;
}
.sheetfirst {
  order: 2;
}
@media (max-width: 759px) {
  .sheetfirst {
    order: 0;
  }
  .queuecard {
    order: 1;
  }
}
.check input {
  width: 22px;
  height: 22px;
}
/* photo */
.drop {
  display: grid;
  justify-items: center;
  gap: 8px;
  padding: 20px 12px;
  border: 2px dashed var(--line);
  background: var(--panel);
  text-align: center;
  cursor: pointer;
}
.drop.over {
  border-color: var(--ink);
}
.thumbs {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.thumbs img {
  width: 84px;
  height: 84px;
  object-fit: cover;
  border: 1px solid var(--line);
}
.logo {
  height: 40px;
  max-width: 120px;
  object-fit: contain;
  background: #fff;
  padding: 3px;
  border: 1px solid var(--line);
}
.crop {
  position: relative;
  touch-action: none;
  user-select: none;
  line-height: 0;
  max-width: 100%;
}
.crop img {
  width: 100%;
  height: auto;
  display: block;
  pointer-events: none;
}
.crop i {
  position: absolute;
  border: 2px solid var(--tag);
  box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.45);
  pointer-events: none;
}
.cropwrap {
  overflow: hidden;
}
.match {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  border: 1px solid var(--line);
  padding: 8px;
  background: var(--bg);
}
.score {
  font: 700 22px/1 var(--disp);
}
.swatches {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}
.sw {
  width: 30px;
  height: 30px;
  border: 1px solid var(--muted);
  cursor: pointer;
  padding: 0;
}
.toast {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(76px + env(safe-area-inset-bottom, 0px));
  z-index: 40;
  background: var(--ink);
  color: var(--bg);
  padding: 10px 12px;
  display: flex;
  gap: 12px;
  align-items: center;
  max-width: calc(100% - 32px);
  width: max-content;
  font-weight: 500;
}
.toast button {
  background: none;
  border: 1px solid currentColor;
  color: inherit;
  padding: 4px 9px;
  cursor: pointer;
  font-weight: 600;
}
.modal {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(0, 0, 0, 0.5);
  display: grid;
  place-items: center;
  padding: 16px;
}
.modal > div {
  background: var(--panel);
  border: 1px solid var(--line);
  padding: 16px;
  display: grid;
  gap: 12px;
  max-width: 440px;
  width: 100%;
  min-width: 0;
}
.modal p {
  overflow-wrap: anywhere;
}
.busy {
  display: flex;
  gap: 10px;
  align-items: center;
  font-weight: 600;
}
.spin {
  width: 18px;
  height: 18px;
  border: 3px solid var(--line);
  border-top-color: var(--ink);
  border-radius: 50%;
  animation: s 1s linear infinite;
}
@keyframes s {
  to {
    transform: rotate(360deg);
  }
}
@media (prefers-reduced-motion: reduce) {
  .spin {
    animation: none;
  }
}
.cardhead {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}
.storerow {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  border-top: 1px solid var(--line);
  padding-top: 8px;
}
.storerow b {

/* Spool Stock: the whole app, in this one file, with no build step.

   - Data lives in Firestore under users/<uid>/ and is mirrored into S (see "State"). Each snapshot from

   - The part of the address after # picks the view: #stock, #s0012 (a spool), #loc-top-shelf (a storage),
     #setup and so on. route() reads it, and render() draws the view by setting #main's HTML from one of the
     v...() functions. Views are plain HTML strings with no handlers of their own.
   - Buttons carry data-go="view" to open a view, or data-act="name" to run actions.name(). One click
     listener near the end handles both.
   - Writes go straight to Firestore, as col("spools").doc(id).update(...). They land in the local copy at
     once, so the app keeps working with no signal and syncs later.

     live data, moving and scanning, printers, routing, then each view with the code behind it, dialogs,
     the event listeners and start-up.

     space, like an AMS or a dryer. A "loose" one is a shelf or box, with its spools in an order you choose.
   - Every spool is a 1 kg spool: netG is always 1000 and remainG is what's left on it.

/* Draws a sticker's steps as an SVG, for the preview on screen. */

    if (p.t === "tri")
      o += `<polygon points="${p.pts.map(n => n.toFixed(3)).join(" ")}" fill="${p.fill}" stroke="${p.fill}" stroke-width=".03"/>`;
    if (p.t === "img")
      o += `<image x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" href="${esc(p.src)}" preserveAspectRatio="xMinYMin meet"/>`;
    if (p.t === "text") {
      const fam = p.font === "mono" ? "Courier New,Courier,monospace" : "Helvetica,Arial,sans-serif";
      o += `<text x="${p.x}" y="${p.y}" font-family="${fam}" font-size="${(p.pt * 0.3528).toFixed(3)}" font-weight="${p.bold ? 700 : 400}" text-anchor="${p.align === "center" ? "middle" : p.align === "right" ? "end" : "start"}" fill="#000">${esc(p.text)}</text>`;
    }
    if (p.t === "qr") {
      const mx = qrMatrix(p.text),
        n = mx.length,
        u = p.s / n;
      let d = "";
      mx.forEach((row, r) =>
        row.forEach((on, c) => {
          if (on)
            d += `M${(p.x + c * u).toFixed(3)} ${(p.y + r * u).toFixed(3)}h${u.toFixed(3)}v${u.toFixed(3)}h-${u.toFixed(3)}z`;
        }),
      );

const imgFormat = src => (/^data:image\/jpe?g/i.test(src) ? "JPEG" : "PNG");
/* Draws a sticker's steps into the PDF, with its top left corner at ox, oy mm. */
function opsToPDF(doc, ops, ox, oy) {
  for (const p of ops) {
    const x = ox + p.x,
      y = oy + p.y;
    if (p.t === "rect") {
      if (p.fill) doc.setFillColor(p.fill);
      if (p.stroke) {
        doc.setDrawColor(p.stroke);
        doc.setLineWidth(0.15);
      }
      doc.rect(x, y, p.w, p.h, p.fill && p.stroke ? "FD" : p.stroke ? "S" : "F");
    }
    if (p.t === "tri") {
      const q = p.pts;
      doc.setFillColor(p.fill);
      doc.setDrawColor(p.fill);
      doc.setLineWidth(0.03);
      doc.triangle(ox + q[0], oy + q[1], ox + q[2], oy + q[3], ox + q[4], oy + q[5], "FD");
    }
    if (p.t === "img") {
      try {
        doc.addImage(p.src, imgFormat(p.src), x, y, p.w, p.h, p.key, "FAST");
      } catch (e) {}
    }
    if (p.t === "text") {
      doc.setFont(p.font === "mono" ? "courier" : "helvetica", p.bold ? "bold" : "normal");
      doc.setFontSize(p.pt);
      doc.setTextColor(0, 0, 0);
      doc.text(p.text, x, y, {align: p.align === "center" ? "center" : p.align === "right" ? "right" : "left"});
    }
    if (p.t === "qr") {
      const mx = qrMatrix(p.text),
        n = mx.length,
        u = p.s / n;
      doc.setFillColor(0, 0, 0);
      mx.forEach((row, r) => {
        let c = 0;
        while (c < n) {
          if (!row[c]) {
            c++;
            continue;
          }
          let e = c;
          while (e < n && row[e]) e++;

          c = e;

function curSheet() {
  const st = S.settings.sheet || {};
  if (st.id === "custom" && st.custom) return {id: "custom", name: "Custom", ...st.custom};
  return SHEETS.find(s => s.id === st.id) || SHEETS[0];

/* Lays the queued stickers out on A4 pages, starting at the sheet's next free label. Returns the PDF and
   which label comes next. */
function buildPDF(items, start, opts) {
  const sh = curSheet(),
    doc = new jspdf.jsPDF({unit: "mm", format: "a4", compress: true});
  // Ask the print dialog to start at actual size: "Fit to page" shrinks the sheet (about 96% on an A4 printer) and pulls
  // the stickers towards the middle, so the top row prints low and the bottom row high.
  try {
    doc.viewerPreferences({PrintScaling: "None"});
  } catch (e) {}
  const per = sh.cols * sh.rows;
  let i = start % per,
    page = 0;
  for (const it of items) {
    const c = i % sh.cols,
      r = Math.floor(i / sh.cols);
    const x = sh.left + c * sh.px + (opts.nx || 0),
      y = sh.top + r * sh.py + (opts.ny || 0);
    opsToPDF(doc, itemOps(it, sh.w, sh.h), x, y);
    if (opts.outline) {
      doc.setDrawColor(150);
      doc.setLineWidth(0.1);
      doc.rect(x, y, sh.w, sh.h);
    }
    i++;
    if (i >= per && it !== items[items.length - 1]) {
      i = 0;
      page++;
      doc.addPage("a4");
    }
  }
  return {doc, next: i % per};
}

/* ==========================================================================================================
   Live data
   watch() subscribes to this user's collections. Firestore answers first from its local copy and again
   when the server replies, so the page appears straight away and then catches up.
   ========================================================================================================== */
/* Subscribes to this user's data. Runs once, after sign-in. */
function watch() {
  loadCatalogue();
  const timer = setTimeout(() => {
    if (!S.ready) {
      S.stale = true;
      render();
    }
  }, 10000);
  const seen = new Set();
  const sub = (name, key) =>
    col(name).onSnapshot(
      snap => {
        const o = {};
        snap.docs.forEach(d => (o[d.id] = {...d.data(), id: d.id}));
        S[key] = o;
        if (!snap.metadata.fromCache) seen.add(key);
        if (seen.size >= 4) {
          clearTimeout(timer);
          S.stale = false;
          S.live = true;
        }
        upgradeStorages(seen);
        S.ready = 1;
        dataChanged();
      },
      e => {
        clearTimeout(timer);
        S.loadErr = (e && e.code) || "unknown";
        if (S.ready) toast("Lost the link to your stock. Reload the page.");
        else render();
      },
    );
  sub("spools", "spools");
  sub("locations", "locs");
  sub("brands", "brands");
  sub("profiles", "profiles");
  sub("printers", "printers");
  sub("jobs", "jobs");
  db.doc("config/main").onSnapshot(
    d => {
      S.settings = d.exists ? {...d.data()} : {};
      if (!d.metadata.fromCache) configSeen = true;
      upgradeStorages(seen);
      dataChanged();
    },
    () => {},
  );
  db.doc("config/orca").onSnapshot(
    d => {
      if (d.metadata.fromCache && !S.orcaSeen) return;
      S.orcaSeen = true;
      S.orcaSig = d.exists ? d.data().sig : null;
      orcaFeedSync();
    },
    () => {},
  );
}

function upgradeStorages(seen) {
  if (upgraded || seen.size < 4 || !configSeen) return;
  upgraded = true;
  if (S.settings.layout >= 2) return;
  for (const [g, ls] of groups()) {
    if (!g || ls.length < 2 || !ls.every(l => l.capacity === 1)) continue;
    const id = newLocId(g),
      first = ls[0],
      moved = {};
    ls.forEach((l, i) => (moved[l.id] = i + 1));
    const doc = {
      name: g,
      group: "",
      kind: first.kind,
      spaces: true,
      capacity: ls.length,
      order: first.order,
      wantLabel: true,
      ...(first.maxC ? {maxC: first.maxC} : {}),
    };
    S.locs[id] = {...doc, id};
    col("locations").doc(id).set(doc);
    for (const s of Object.values(S.spools)) {
      const patch = {};
      if (moved[s.loc]) {
        patch.loc = id;
        patch.slot = moved[s.loc];
      }
      if ((s.history || []).some(h => moved[h.from] || moved[h.to]))
        patch.history = s.history.map(h => ({...h, from: moved[h.from] ? id : h.from, to: moved[h.to] ? id : h.to}));
      if (Object.keys(patch).length) col("spools").doc(s.id).update(patch);
    }

function kiloSpools() {
  if (!S.live) return;
  for (const sp of Object.values(S.spools)) {
    if (sp.netG === FULL_G && (sp.remainG == null || sp.remainG <= FULL_G)) continue;
    const remainG = Math.min(FULL_G, Math.round(sp.remainG ?? sp.netG ?? FULL_G));
    S.spools[sp.id] = {...sp, netG: FULL_G, remainG};

/* ==========================================================================================================
   Moving and scanning
   tryMove() checks a move (full storage, material warnings) and asks if needed. doMove() then saves it.
   handleScan() is what a scanned sticker code leads to: a spool is remembered for 5 minutes (MOVE_WINDOW),
   and a storage scanned in that time gets that spool.
   ========================================================================================================== */
/* Saves a move, with Undo. opts.swap is a spool to send the other way when the space is taken. */
async function doMove(id, to, opts = {}) {
  const sp = S.spools[id];
  if (!sp) return;
  const from = sp.loc || null,
    l = S.locs[to],
    other = opts.swap ? S.spools[opts.swap] : null;
  if (from === to) {
    toast("Already in " + locName(to));
    return;
  }
  const seat = !spaced(l) ? null : other ? spaceOf(other) : (freeSpaces(l)[0] ?? null),
    oldSeat = spaceOf(sp);
  const patch = {
    loc: to,
    slot: seat,
    pos: spaced(l) ? null : nextPos(to),
    status: "active",
    history: [{at: Date.now(), from, to}, ...(sp.history || [])].slice(0, 30),
  };
  if (l && l.kind === "dryer") patch.lastDried = Date.now();
  try {
    await col("spools").doc(id).update(patch);
    if (other)
      await col("spools")
        .doc(other.id)
        .update({
          loc: from,
          slot: oldSeat,
          history: [{at: Date.now(), from: to, to: from}, ...(other.history || [])].slice(0, 30),
        });
    S.spools[id] = {...sp, ...patch};
    if (other) S.spools[other.id] = {...other, loc: from, slot: oldSeat};
    const hot = hotNote(sp, l),
      place = spotName(S.spools[id]);
    if (S.view === "scan") Scanner.moved(id, place, hot);
    else render();
    toast(`${id.toUpperCase()} moved to ${place}.${hot}`, "Undo", async () => {
      await col("spools")
        .doc(id)
        .update({
          loc: from,
          slot: sp.slot ?? null,
          status: sp.status || "active",
          history: sp.history || [],
          lastDried: sp.lastDried || null,
        });
      if (other)
        await col("spools")
          .doc(other.id)
          .update({loc: to, slot: other.slot ?? null, history: other.history || []});
    });
  } catch (e) {
    fail(e, "That move didn't save");
  }
}

const hotNote = (sp, l) =>

function tryMove(id, to) {
  const sp = S.spools[id],
    l = S.locs[to];
  if (!sp || !l) return;
  if (sp.loc === to) {
    toast("Already in " + locName(to));
    return;
  }
  const place = () => {
    const here = inLoc(to).filter(s => s.id !== id);
    if (!l.capacity || here.length < l.capacity) {
      doMove(id, to);
      return;
    }
    if (!spaced(l) && l.capacity !== 1) {
      ask(`${l.name} is full`, `It holds ${l.capacity}. Move something out first, or raise the limit in Setup.`, [
        ["OK", null],
      ]);
      return;
    }
    const out = sp.loc ? `It goes to ${locName(sp.loc)}.` : "It will have no storage set.";
    ask(`${l.name} is full`, `Which spool comes out? ${out}`, [
      ...here.map(o => [
        `${o.id.toUpperCase()} ${o.material} ${o.colour || ""}`.trim(),
        () => doMove(id, to, {swap: o.id}),
      ]),
      ["Cancel", null],
    ]);
  };
  const hit = warnHit(sp, l);
  if (hit)
    ask(`${hit} in ${l.name}`, `${sp.material} is on the warning list for ${l.name}. Move it anyway?`, [
      ["Move anyway", place, "go"],
      ["Cancel", null],
    ]);

}
/* What a scanned or typed sticker code leads to. source is "page" when the app's own scanner read it. */
function handleScan(code, source) {
  if (!code) {
    toast("That isn't one of your stickers.");
    return;
  }
  if (/^s\d+/.test(code)) {
    if (!S.spools[code]) {
      go(code);
      return;
    }
    if (source === "page" && S.view === "scan") {
      Scanner.take(code);
      return;
    }
    local.set("pending", {id: code, at: Date.now()});
    S.scanned = code;
    go(code);
    return;
  }
  const id = code.replace(/^loc-/, "");
  if (!S.locs[id]) {
    toast("That storage isn't in the system any more.");
    return;
  }
  if (source === "page" && S.view === "scan") {
    Scanner.take(code);
    return;
  }
  const p = local.get("pending");
  go(code);
  if (p && Date.now() - p.at < MOVE_WINDOW && S.spools[p.id]) {
    local.del("pending");
    tryMove(p.id, id);
  }
}

  const l = S.locs[f.loc];
  if (!l) return "a removed storage";
  return locName(l.id) + (f.kind === "external" && spaced(l) && l.capacity > 1 ? `, space ${f.space || 1}` : "");
};
/* Which printer feed a spool sits in, if any */
function feedOf(s) {
  const l = S.locs[s.loc];
  if (!l) return null;
  for (const p of orderedPrinters())
    for (const f of p.feeds || []) {
      if (f.loc !== l.id) continue;
      if (f.kind === "ams") return {printer: p, feed: f, label: `${p.name}, ${feedLabel(f)} tray ${spaceOf(s) || "?"}`};
      if (!spaced(l) || (spaceOf(s) || 1) === (f.space || 1))
        return {printer: p, feed: f, label: `${p.name}, external spool`};
    }
  return null;
}
/* The spool in a printer's tray, as the printer numbers them: AMS unit and tray from 0, or "external" */
function trayToSpool(printer, unit, tray) {
  const p =
    typeof printer === "string"
      ? Object.values(S.printers).find(x => x.id === printer || x.serial === printer || x.name === printer)
      : printer;
  if (!p) return null;
  const f = (p.feeds || []).find(f =>
    unit === "external" ? f.kind === "external" : f.kind === "ams" && f.unit === Number(unit) + 1,
  );
  const l = f && S.locs[f.loc];
  if (!l) return null;
  if (unit === "external") return spaced(l) ? seated(l)[(f.space || 1) - 1] || null : looseOrder(l)[0] || null;
  return spaced(l) ? seated(l)[Number(tray)] || null : null;
}
window.SpoolStock = {trayToSpool, feedOf};

/* ==========================================================================================================
   Routing
   go(view) changes the address, and the hashchange listener calls route(). A hash that arrives from outside
   (a sticker scanned with the phone's own camera) is treated as a scan.
   ========================================================================================================== */
const VIEWS = ["stock", "add", "scan", "stickers", "usage", "setup", "import", "log"];
/* Opens a view: go("stock"), go("s0012"), go("loc-top-shelf"). */
function go(v) {
  internal = true;
  if (location.hash === "#" + v) {
    internal = false;
    route(false);
    return;
  }
  location.hash = v;
}
addEventListener("hashchange", () => {
  const ext = !internal;
  internal = false;
  if (booted) route(ext);
});
/* Reads the address into S.view and S.param, then draws. */
function route(external) {
  const h = location.hash.slice(1).toLowerCase() || "stock";
  if (external && (/^s\d+/.test(h) || h.startsWith("loc-"))) {
    S.view = h.startsWith("loc-") ? "loc" : "spool";
    S.param = h.replace(/^loc-/, "");
    handleArrival(h);
    return;
  }
  if (/^s\d+/.test(h)) {
    S.view = "spool";
    S.param = h;
  } else if (h.startsWith("edit-")) {
    S.view = "edit";
    S.param = h.slice(5);
  } else if (h.startsWith("loc-")) {
    S.view = "loc";
    S.param = h.slice(4);
  } else if (h.startsWith("store-")) {
    S.view = "store";
    S.param = h.slice(6);
    storeDraft(S.param);
  } else if (h.startsWith("printer-")) {
    S.view = "printer";
    S.param = h.slice(8);
    printerDraft(S.param);
  } else if (VIEWS.includes(h)) {
    S.view = h;
    S.param = null;
  } else {
    S.view = "stock";
    S.param = null;
  }
  if (S.view === "add" && !spoolEdit) newDraft();
  if (S.view === "edit") editDraft(S.param);
  render();
  try {
    scrollTo(0, 0);
  } catch {}
}
function handleArrival(code) {
  // a sticker was scanned with the phone's own camera and opened this link
  if (code.startsWith("loc-")) {
    const id = code.slice(4),
      p = local.get("pending");
    render();
    if (p && Date.now() - p.at < MOVE_WINDOW && S.spools[p.id] && S.locs[id]) {
      local.del("pending");
      tryMove(p.id, id);
    }
  } else {
    if (S.spools[code]) local.set("pending", {id: code, at: Date.now()});
    S.scanned = code;
    render();
  }
}

/* ==========================================================================================================
   Views
   render() picks the view for S.view and sets #main's HTML. Each v...() function returns that HTML as a string.
   ========================================================================================================== */
/* Draws the current view. Until signed in and loaded, shows the sign-in form or a waiting message instead. */
function render() {
  document.querySelectorAll("[data-nav]").forEach(b => {
    if (b.dataset.nav === S.view || (S.view === "edit" && b.dataset.nav === "add"))
      b.setAttribute("aria-current", "page");
    else b.removeAttribute("aria-current");
  });
  const m = $("#main");
  if (S.view !== "scan") Scanner.stop();
  if (S.arrange && (S.view !== "loc" || S.param !== S.arrange)) {
    S.arrange = null;
    S.arrSel = null;
  }
  if (!db) {
    m.innerHTML = !CFG.firebase
      ? SOURCE_NOTE
      : !started
        ? `<div class="busy"><span class="spin"></span>Starting up</div>`
        : vLogin();
    return;
  }
  if (!S.ready && S.loadErr) {
    m.innerHTML = `<div class="card"><h2>Can't open your stock</h2><p>${S.loadErr === "permission-denied" ? "Firebase refused access. Open Firestore in the Firebase console, go to the Rules tab, paste in firestore.rules and press Publish, then reload this page." : "Firebase gave an error, so reload the page. If it keeps happening, note this code."}</p><p class="mono">${esc(S.loadErr)}</p></div>`;
    return;
  }
  if (!S.ready) {
    m.innerHTML = S.stale
      ? `<div class="note warn">Can't reach your stock yet. Check your signal, it will load when it connects.</div>`
      : `<div class="busy"><span class="spin"></span>Opening your stock</div>`;
    return;
  }
  const v =
    {
      stock: vStock,
      add: vForm,
      edit: vForm,
      scan: vScan,
      stickers: vStickers,
      setup: vSetup,
      spool: vSpool,
      loc: vLoc,
      store: vStore,
      printer: vPrinter,
      import: vImport,
      log: vLog,
      usage: vUsage,
    }[S.view] || vStock;
  m.innerHTML =
    (!navigator.onLine
      ? `<div class="note warn">No signal. Changes are kept on this device and sync when you're back.</div>`
      : S.stale
        ? `<div class="note warn">Showing your last saved copy. It may be out of date.</div>`
        : "") + v();
  if (S.view === "stock" && S.focusSearch) {
    S.focusSearch = false;
    $("#q")?.focus();
    $("#q")?.select();
  }
  if (S.view === "scan") Scanner.attach();
  if (S.view === "add" || S.view === "edit") formPreview();
  if (S.view === "store" && storeEdit) storePreview();
  if (crop) drawCrop();
}

/* The stock board, search and spool list. */
function vStock() {

const emptyList = n =>

    ? `<div class="card">Nothing matches that search.</div>`

/* The orders the spool list can be put in. Ties fall back to the spool code. */
const left = s => s.remainG ?? s.netG ?? 0;
const SORTS = {
  code: {label: "By code", by: () => 0},
  least: {label: "Least left first", by: (a, b) => left(a) - left(b)},
  most: {label: "Most left first", by: (a, b) => left(b) - left(a)},
  name: {
    label: "By material",
    by: (a, b) => `${a.material} ${a.colour}`.localeCompare(`${b.material} ${b.colour}`),
  },
  newest: {label: "Newest first", by: (a, b) => (b.addedAt || 0) - (a.addedAt || 0)},
};
const stockSort = () => (SORTS[local.get("stockSort")] ? local.get("stockSort") : "code");
/* The spool list under the board, after the search box and chips have been applied. */
function stockRows() {
  const f = S.filter,
    q = f.q.toLowerCase(),
    live = liveSpools();

    .filter(s => {

        q &&

      )

/* live camera scanner: scan a spool, then a storage */
const Scanner = {
  stream: null,
  timer: 0,
  last: "",
  lastAt: 0,
  held: null,
  msg: "",
  canvas: null,
  det: null,
  say(text, held) {
    const n = $("#scanState");
    if (n) {
      n.textContent = text;
      n.classList.toggle("held", !!held);
    }
    const o = $("#heldOpen");
    if (o) o.hidden = !this.held;
  },
  attach() {
    this.say(this.msg || "Scan a spool sticker", !!this.held);
    if (this.stream) this.show();
    else if (local.get("camOK")) this.start();
  },
  show() {
    const v = $("#cam");
    if (!v) return;
    $("#camWrap").hidden = false;
    $("#camStart").hidden = true;
    $("#camStop").hidden = false;
    v.srcObject = this.stream;
    v.play().catch(() => {});
    clearInterval(this.timer);
    this.timer = setInterval(() => this.tick(), 180);
  },
  async start() {
    if (!navigator.mediaDevices?.getUserMedia) {
      this.say("This browser can't use the camera. Take a photo instead.");
      return;
    }
    try {
      this.stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {facingMode: {ideal: "environment"}, width: {ideal: 1280}, height: {ideal: 720}},
      });
      local.set("camOK", true);
      if ("BarcodeDetector" in window) {
        try {
          this.det = new BarcodeDetector({formats: ["qr_code"]});
        } catch {}
      }
      if (S.view === "scan") this.show();
      else this.stop();
    } catch (e) {
      local.del("camOK");
      this.say("Camera blocked. Allow it in your settings, or take a photo instead.");
    }
  },
  stop() {
    clearInterval(this.timer);
    this.timer = 0;
    if (this.stream) {
      this.stream.getTracks().forEach(t => t.stop());
      this.stream = null;
    }
    const w = $("#camWrap");
    if (w) {
      w.hidden = true;
      $("#camStart").hidden = false;
      $("#camStop").hidden = true;
    }
  },
  busy: false,
  async tick() {
    const v = $("#cam");
    if (!v || v.readyState < 2 || this.busy || !$("#modal").hidden) return;
    this.busy = true;
    try {
      let raw = null;
      if (this.det) {
        const r = await this.det.detect(v).catch(() => []);
        raw = r[0]?.rawValue || null;
      }
      if (!raw && window.jsQR) {
        const c = this.canvas || (this.canvas = document.createElement("canvas")),
          k = Math.min(1, 800 / v.videoWidth);
        c.width = (v.videoWidth * k) | 0;
        c.height = (v.videoHeight * k) | 0;
        const x = c.getContext("2d", {willReadFrequently: true});
        x.drawImage(v, 0, 0, c.width, c.height);
        raw =
          jsQR(x.getImageData(0, 0, c.width, c.height).data, c.width, c.height, {inversionAttempts: "dontInvert"})
            ?.data || null;
      }
      if (raw) this.found(raw);
    } finally {
      this.busy = false;
    }
  },
  found(raw) {
    const code = parseCode(raw),
      now = Date.now();
    if (!code || (code === this.last && now - this.lastAt < 3000)) return;
    this.last = code;
    this.lastAt = now;
    try {
      navigator.vibrate && navigator.vibrate(60);
    } catch {}
    this.take(code);
  },
  take(code) {
    if (/^s\d+/.test(code)) {
      const sp = S.spools[code];
      if (!sp) {
        this.msg = `${code.toUpperCase()} isn't in your stock`;
        this.held = null;
        this.say(this.msg);
        return;
      }
      const target = local.get("scanTarget");
      if (target && S.locs[target]) {
        this.held = null;
        tryMove(code, target);
        return;
      }
      this.held = code;
      this.msg = `${code.toUpperCase()} ${sp.material} ${sp.colour || ""}. Now scan a storage`;
      this.say(this.msg, true);
    } else {
      const id = code.replace(/^loc-/, "");
      if (!S.locs[id]) {
        this.msg = "That storage isn't in the system any more";
        this.say(this.msg);
        return;
      }
      if (!this.held) {
        this.msg = `That's ${locName(id)}. Scan a spool first`;
        this.say(this.msg);
        return;
      }
      const h = this.held;
      this.held = null;
      tryMove(h, id);
    }
  },
  moved(id, place, note) {
    this.msg = `${id.toUpperCase()} is in ${place}.${note || ""} Scan the next spool`;
    this.say(this.msg);
  },
};

/* searching manufacturers and their filaments */
const Picks = {brands: [], lines: []};
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
function brandOptions(q) {
  const seen = new Map(),
    add = (name, n, aka) => {
      const k = slug(name);
      if (!seen.has(k)) seen.set(k, {name, n: 0, aka: []});
      if (n) seen.get(k).n = n;
      if (aka) seen.get(k).aka = aka;
    };
  Object.values(S.brands).forEach(b => add(b.name));
  BRANDS.forEach(b => add(b));
  Object.values(CAT || {}).forEach(c => add(c.name, c.lines.length, c.aka));
  const t = norm(q),
    hit = b => [b.name, ...b.aka].some(x => norm(x).includes(t)),
    rank = b => (norm(b.name).startsWith(t) ? 0 : 1);
  return [...seen.values()].filter(hit).sort((a, b) => rank(a) - rank(b) || a.name.localeCompare(b.name));
}
function lineOptions(brand, q) {
  const saved = Object.values(S.profiles)
    .filter(p => slug(p.brand) === slug(brand))
    .map(p => ({n: p.material, saved: true, hay: searchText(p.material)}));
  const lines = (catBrand(brand)?.lines || []).filter(l => !saved.some(p => norm(p.n) === norm(l.n)));
  const all = [...saved, ...lines];
  const t = norm(q),
    rank = l => {
      const n = norm(l.n),
        a = [].concat(l.a || []).map(norm);
      return n === t || a.includes(t) ? 0 : n.startsWith(t) || a.some(x => x.startsWith(t)) ? 1 : 2;
    };
  const list = (all.length ? all : MATERIALS.map(m => ({n: m.key, hay: searchText(m.key), generic: true}))).filter(l =>
    matches(l.hay, q),
  );
  return {
    list: t
      ? list
          .map((l, i) => [rank(l), i, l])
          .sort((a, b) => a[0] - b[0] || a[1] - b[1])
          .map(x => x[2])
      : list,
    own: all.length > 0,
  };
}

/* Saves the form: one spool when editing, or as many identical new ones as asked for. */
async function submitForm() {

    toast("Add the manufacturer and material name.");

    brand = spoolEdit.brand.trim(),

  const body = {
    brand,
    material,
    colour: spoolEdit.colour.trim(),
    hex: list[0],
    colours: list,
    pattern: list.length > 1 ? spoolEdit.pattern : "solid",
    finish: spoolEdit.finish,
    netG: FULL_G,
    remainG: leftOf(spoolEdit.left),
    tareG: num(spoolEdit.tareG),
    note: String(spoolEdit.note || "")
      .trim()
      .slice(0, 300),
    dia: num(spoolEdit.dia) || 1.75,
    nMin: num(spoolEdit.nMin),
    nMax: num(spoolEdit.nMax),
    bMin: num(spoolEdit.bMin),
    bMax: num(spoolEdit.bMax),
    dT: num(spoolEdit.dT),
    dH: num(spoolEdit.dH),
  };
  try {
    const bId = slug(brand),
      oldB = S.brands[bId];
    await col("brands")
      .doc(bId)
      .set({...(oldB || {}), name: oldB?.name || brand, tareG: body.tareG || oldB?.tareG || null});
    await col("profiles").doc(profileId(brand, material)).set({
      brand,
      material,
      nMin: body.nMin,
      nMax: body.nMax,
      bMin: body.bMin,
      bMax: body.bMax,
      dT: body.dT,
      dH: body.dH,
    });
    let first,
      noRoom = 0;
    if (spoolEdit.editId) {
      first = spoolEdit.editId;
      const old = S.spools[spoolEdit.editId];
      const spot =
        (spoolEdit.loc || null) === (old.loc || null)
          ? {loc: old.loc || null, slot: old.slot ?? null}
          : placer(spoolEdit.loc || null)();
      await col("spools")
        .doc(spoolEdit.editId)
        .update({...body, ...spot, labelled: false});
    } else {
      const n = clamp(parseInt(spoolEdit.qty) || 1, 1, 20),
        {ids, last} = nextIds(n);
      first = ids[0];
      const spot = placer(spoolEdit.loc || null);
      for (const id of ids) {
        const doc = newSpool(body, now, spot());
        if (!doc.loc && spoolEdit.loc) noRoom++;
        await col("spools").doc(id).set(doc);
        S.spools[id] = {...doc, id};
      }
      await saveConfig({lastId: last});
    }
    const added = spoolEdit.editId ? null : parseInt(spoolEdit.qty) || 1;
    spoolEdit = null;
    crop = null;
    autoLogo(brand).then(ok => {
      if (ok) toast(brand + " logo added.");
    });

/* Builds and saves the sticker PDF, then marks those stickers as printed. */
async function makePDF() {
  const items = queue().filter(i => !queueOpts.skip.has(i.key));
  if (!items.length) return;
  const st = S.settings.sheet || {},
    sh = curSheet(),
    start = (st.start || 0) % (sh.cols * sh.rows);
  if (!window.jspdf) {
    toast("The PDF maker didn't load. Reload the page and try again.");
    return;
  }
  const {doc, next} = buildPDF(items, start, {nx: num(st.nx) || 0, ny: num(st.ny) || 0, outline: queueOpts.outline});
  try {
    await downloads.save({
      filename: "spool-stickers.pdf",
      data: new Blob([doc.output("arraybuffer")], {type: "application/pdf"}),
    });
  } catch (e) {
    toast("Couldn't save the PDF here. Try from a computer.");
    return;
  }
  if (queueOpts.outline) {
    toast("Test sheet saved. Stickers stay in the queue.");
    return;
  }
  try {
    for (const it of items) {
      if (it.kind === "spool") await col("spools").doc(it.data.id).update({labelled: true});
      else await col("locations").doc(it.data.id).update({wantLabel: false});
    }
    await saveConfig({sheet: {...st, start: next}});
    toast("Saved. Those stickers are marked as printed.");
  } catch (e) {
    fail(e, "PDF saved, but the queue didn't update");
  }
}

   Images

const loadImg = blob =>
  new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = rej;
    i.src = URL.createObjectURL(blob);
  });
function toCanvas(img, max) {
  const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas");
  c.width = Math.round(img.naturalWidth * k);
  c.height = Math.round(img.naturalHeight * k);
  c.getContext("2d", {willReadFrequently: true}).drawImage(img, 0, 0, c.width, c.height);
  return c;
}
const canvasBlob = (c, type = "image/jpeg", q = 0.85) => new Promise(r => c.toBlob(r, type, q));
/* Finds a QR code in a photo, trying smaller copies of it until one reads. */
async function decodeQR(file) {
  const img = await loadImg(file);
  if ("BarcodeDetector" in window) {
    try {
      const r = await new BarcodeDetector({formats: ["qr_code"]}).detect(img);
      if (r[0]) return r[0].rawValue;
    } catch {}
  }
  for (const max of [1400, 900, 600, 2200]) {
    const c = toCanvas(img, max),
      d = c.getContext("2d").getImageData(0, 0, c.width, c.height);
    const q = jsQR(d.data, c.width, c.height, {inversionAttempts: "attemptBoth"});
    if (q) return q.data;
  }
  return null;
}
/* The spool or storage code at the end of a scanned link: "s0012" or "loc-top-shelf". */
const parseCode = t => {
  const m = /(?:#|^)\s*(s\d{4,}|loc-[a-z0-9-]+)\s*$/i.exec(String(t || "").trim());
  return m ? m[1].toLowerCase() : null;
};

/* Cropping a logo out of a photo */
function openCrop(url, w, h, brand, box, back) {

      ? [clamp(box[0], 0, 1), clamp(box[1], 0, 1), clamp(box[2], 0, 1), clamp(box[3], 0, 1)]
      : [0.1, 0.1, 0.9, 0.45];
  if (bx[2] - bx[0] < 0.03 || bx[3] - bx[1] < 0.02) {
    bx[0] = 0.1;
    bx[1] = 0.1;
    bx[2] = 0.9;
    bx[3] = 0.45;
  }

}
const cropHTML =
  () => `<div class="card" id="cropCard"><h2>${esc(crop.brand)} logo</h2><p>Drag a box round the logo. It goes on every ${esc(crop.brand)} sticker.</p>

  <div class="btns"><button class="btn go" data-act="cropSave">Use this logo</button><button class="btn" data-act="cropSkip">Skip</button></div></div>`;
function drawCrop() {

/* turns any logo into solid black on a transparent background, keeping soft edges so it prints smoothly */
function blackLogo(ctx, w, h) {
  const im = ctx.getImageData(0, 0, w, h),
    d = im.data;
  let see = 0;
  for (let i = 3; i < d.length; i += 4) if (d[i] < 128) see++;
  if (see > w * h * 0.05) {
    for (let i = 0; i < d.length; i += 4) {
      const lum = d[i] * 0.3 + d[i + 1] * 0.59 + d[i + 2] * 0.11,
        keep = lum > 245 ? 0 : d[i + 3];
      d[i] = d[i + 1] = d[i + 2] = 0;
      d[i + 3] = keep;
    }
  } else {
    const hist = new Array(256).fill(0);
    for (let i = 0; i < d.length; i += 4) {
      const a = d[i + 3] / 255,
        v = (d[i] * 0.3 + d[i + 1] * 0.59 + d[i + 2] * 0.11) * a + 255 * (1 - a);
      d[i] = v;
      hist[v | 0]++;
    }
    let total = w * h,
      sum = 0,
      sb = 0,
      wb = 0,
      best = 0,
      th = 128;
    for (let i = 0; i < 256; i++) sum += i * hist[i];
    for (let i = 0; i < 256; i++) {
      wb += hist[i];
      if (!wb) continue;
      const wf = total - wb;
      if (!wf) break;
      sb += i * hist[i];
      const mb = sb / wb,
        mf = (sum - sb) / wf,
        v = wb * wf * (mb - mf) * (mb - mf);
      if (v > best) {
        best = v;
        th = i;
      }
    }
    let dark = 0;
    for (let i = 0; i <= th; i++) dark += hist[i];
    const inv = dark > total / 2,
      soft = 14;
    for (let i = 0; i < d.length; i += 4) {
      const v = d[i],
        a = clamp((inv ? v - th : th - v) / soft + 0.5, 0, 1);
      d[i] = d[i + 1] = d[i + 2] = 0;
      d[i + 3] = Math.round(a * 255);
    }
  }
  ctx.putImageData(im, 0, 0);
}
function trimWhite(c) {
  const ctx = c.getContext("2d"),
    {width: w, height: h} = c,
    d = ctx.getImageData(0, 0, w, h).data;
  let x0 = w,
    y0 = h,
    x1 = -1,
    y1 = -1;
  for (let y = 0; y < h; y++)
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      if (d[i + 3] > 40) {
        if (x < x0) x0 = x;
        if (x > x1) x1 = x;
        if (y < y0) y0 = y;
        if (y > y1) y1 = y;
      }
    }
  if (x1 < 0) return null;
  const o = document.createElement("canvas");
  o.width = x1 - x0 + 1;
  o.height = y1 - y0 + 1;
  o.getContext("2d").drawImage(c, x0, y0, o.width, o.height, 0, 0, o.width, o.height);
  return o;
}
async function saveLogo() {
  const img = await new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i);

  cv.width = Math.round(sw * k);
  cv.height = Math.round(sh * k);
  cv.getContext("2d", {willReadFrequently: true}).drawImage(img, a * W, b * H, sw, sh, 0, 0, cv.width, cv.height);

/* ==========================================================================================================
   Logos
   Logos are kept per manufacturer in your own data (S.brands), never in this repository. Whatever the source,
   a logo is turned solid black on a transparent background so it prints cleanly on a black and white sticker.
   ========================================================================================================== */
const logoData = b => (b && b.logo ? {src: b.logo, w: b.logoW, h: b.logoH, key: "logo-" + slug(b.name)} : null);
const loadCross = url =>
  new Promise((res, rej) => {
    const i = new Image();
    i.crossOrigin = "anonymous";
    i.onload = () => res(i);
    i.onerror = () => rej(new Error("blocked"));
    i.src = url;
  });
function inkCanvas(source, w, h) {
  const k = Math.min(1600 / Math.max(w, h), 1),
    c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(w * k));
  c.height = Math.max(1, Math.round(h * k));
  const ctx = c.getContext("2d", {willReadFrequently: true});
  ctx.drawImage(source, 0, 0, c.width, c.height);
  blackLogo(ctx, c.width, c.height);
  return trimWhite(c);
}
async function svgInk(text) {
  const el = new DOMParser().parseFromString(text, "image/svg+xml").documentElement;
  if (el.nodeName.toLowerCase() !== "svg") return null;
  const vb = (el.getAttribute("viewBox") || "")
    .trim()
    .split(/[\s,]+/)
    .map(Number);
  const w = vb.length === 4 ? vb[2] : parseFloat(el.getAttribute("width")) || 100,
    h = vb.length === 4 ? vb[3] : parseFloat(el.getAttribute("height")) || 100,
    k = 1600 / Math.max(w, h);
  el.setAttribute("width", w * k);
  el.setAttribute("height", h * k);
  const img = await loadImg(new Blob([new XMLSerializer().serializeToString(el)], {type: "image/svg+xml"}));
  return inkCanvas(img, w * k, h * k);
}

  const logos = j.logos && typeof j.logos === "object" ? j.logos : {};

/* Restoring a backup. restoreJob holds a backup file that has been chosen and checked, until you say what
   to do with it. The parts of a backup are Firestore collections, each kept in S under its own key. */
let restoreJob = null;
const BACKUP_PARTS = [
  ["spools", "spools"],
  ["locations", "locs"],
  ["brands", "brands"],
  ["profiles", "profiles"],
  ["printers", "printers"],
  ["jobs", "jobs"],
];
function readBackup(text, name) {
  let d;
  try {
    d = JSON.parse(text);
  } catch {
    throw "That file isn't a Spool Stock backup.";
  }
  if (!d || typeof d !== "object" || !d.spools || typeof d.spools !== "object" || Array.isArray(d.spools))
    throw "That file isn't a Spool Stock backup. Use one saved with Download full backup.";
  const words = {spools: "spool", locations: "storage", brands: "manufacturer", profiles: "saved setting"};
  const parts = [];
  for (const [part] of BACKUP_PARTS) {
    const docs = d[part];
    if (!docs || typeof docs !== "object" || Array.isArray(docs)) {
      d[part] = null;
      continue;
    }
    for (const id of Object.keys(docs))
      if (!/^[\w-]{1,80}$/.test(id) || !docs[id] || typeof docs[id] !== "object") delete docs[id];
    const n = Object.keys(docs).length;
    if (n) parts.push(plural(n, words[part] || part.replace(/s$/, "")));
  }
  const saved = d.saved && !isNaN(Date.parse(d.saved)) ? when(Date.parse(d.saved)) : "at an unknown time";
  return {data: d, name, saved, summary: parts.join(", ")};
}
/* Writes a backup back. With replace, anything not in the backup is removed, and its settings are used too. */
async function runRestore(replace) {
  const d = restoreJob.data;
  let put = 0,
    gone = 0;
  for (const [part, key] of BACKUP_PARTS) {
    const docs = d[part];
    if (!docs) continue;
    for (const [id, doc] of Object.entries(docs)) {
      if (!replace && S[key][id]) continue;
      const body = {...doc};
      delete body.id;
      col(part).doc(id).set(body);
      put++;
    }
    if (replace)
      for (const id of Object.keys(S[key]))
        if (!docs[id]) {
          col(part).doc(id).delete();
          gone++;
        }
  }
  if (d.config && typeof d.config === "object" && (replace || !Object.keys(S.settings).length))
    db.doc("config/main").set(d.config);
  restoreJob = null;
  render();
  toast(
    replace
      ? `Restored. ${put} put back${gone ? `, ${gone} removed` : ""}.`
      : put
        ? `Added ${put} that ${put === 1 ? "was" : "were"} missing.`
        : "Nothing was missing, so nothing changed.",
  );
}

/* ==========================================================================================================
   Logging a print by hand
   Reads a sliced file (an Orca or Bambu Studio .gcode.3mf, or plain G-code) for the grams each filament used,
   suggests a spool for each, and takes the grams off. The Orca plugin does the same without being asked.
   ========================================================================================================== */
let printLog = null;
/* Reads one file out of a zip (a .3mf is a zip) without a library. */
async function unzipEntry(file, want) {
  const buf = new Uint8Array(await file.arrayBuffer()),
    dv = new DataView(buf.buffer);
  let e = buf.length - 22;
  while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw "That file isn't a sliced 3MF.";
  let p = dv.getUint32(e + 16, true);
  const n = dv.getUint16(e + 10, true),
    names = [];
  for (let i = 0; i < n; i++) {
    const method = dv.getUint16(p + 10, true),
      size = dv.getUint32(p + 20, true),
      nl = dv.getUint16(p + 28, true),
      xl = dv.getUint16(p + 30, true),
      cl = dv.getUint16(p + 32, true),
      at = dv.getUint32(p + 42, true);
    const name = new TextDecoder().decode(buf.subarray(p + 46, p + 46 + nl));
    names.push(name);
    if (want.test(name)) {
      const start = at + 30 + dv.getUint16(at + 26, true) + dv.getUint16(at + 28, true),
        raw = buf.subarray(start, start + size);
      if (method === 0) return new TextDecoder().decode(raw);
      const out = new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw")));
      return await out.text();
    }
    p += 46 + nl + xl + cl;
  }
  return null;
}
/* Filament used, from the comments a slicer leaves at the end of plain G-code. */
function gcodeUse(text) {
  const grab = re => {
    const m = re.exec(text);
    return m ? m[1].trim() : null;
  };
  let g = grab(/;\s*filament used \[g\]\s*[=:]\s*([^\n]+)/i);
  const total = grab(/;\s*total filament weight \[g\]\s*[=:]\s*([^\n]+)/i);
  const grams = (g || total || "")
    .split(/[,;]/)
    .map(x => parseFloat(x))
    .filter(x => Number.isFinite(x));
  const types = (grab(/;\s*filament_type\s*=\s*([^\n]+)/i) || "").split(";").map(x => x.trim());
  const cols = (grab(/;\s*filament_colou?r\s*=\s*([^\n]+)/i) || "").split(/[;,]/).map(x => x.trim());
  return grams
    .map((v, i) => ({
      id: i + 1,
      g: v,
      type: types[i] || types[0] || "",
      hex: /^#?[0-9a-f]{6}/i.test(cols[i] || "") ? "#" + cols[i].replace("#", "").slice(0, 6) : "",
    }))
    .filter(f => f.g > 0);
}
/* The plates of a sliced file, each with the grams of every filament it uses. */
async function readSliced(file) {
  const name = file.name.replace(/\.(gcode\.3mf|3mf|gcode|gco|bgcode)$/i, "");
  if (/\.3mf$/i.test(file.name)) {
    const info = await unzipEntry(file, /Metadata\/slice_info\.config$/i);
    if (info) {
      const doc = new DOMParser().parseFromString(info, "text/xml"),
        plates = [...doc.querySelectorAll("plate")]
          .map(pl => {
            const meta = k => pl.querySelector(`metadata[key="${k}"]`)?.getAttribute("value");
            const fil = [...pl.querySelectorAll("filament")]
              .map(f => ({
                id: +f.getAttribute("id"),
                g: parseFloat(f.getAttribute("used_g")),
                type: f.getAttribute("type") || "",
                hex: f.getAttribute("color") || "",
              }))
              .filter(f => f.g > 0);
            return {plate: meta("index") || "1", fil};
          })
          .filter(p => p.fil.length);
      if (plates.length) return {name, plates};
    }
    const gc = await unzipEntry(file, /Metadata\/plate_\d+\.gcode$/i);
    if (gc) {
      const fil = gcodeUse(gc.slice(0, 400000) + gc.slice(-400000));
      if (fil.length) return {name, plates: [{plate: "1", fil}]};
    }
    throw "That 3MF hasn't been sliced. In Orca use Export plate sliced file.";
  }
  const text = (await file.slice(0, 400000).text()) + "\n" + (await file.slice(Math.max(0, file.size - 400000)).text());
  const fil = gcodeUse(text);
  if (!fil.length) throw "Couldn't find filament usage in that G-code.";
  return {name, plates: [{plate: "1", fil}]};
}
const rgb = h => {
  const m = /^#?([0-9a-f]{6})/i.exec(h || "");
  if (!m) return null;
  const n = parseInt(m[1], 16);
  return [n >> 16, (n >> 8) & 255, n & 255];
};
const colourGap = (a, b) => {
  const x = rgb(a),
    y = rgb(b);
  return x && y ? Math.hypot(x[0] - y[0], x[1] - y[1], x[2] - y[2]) / 441 : 0.5;
};
const loaded = s => {
  const l = S.locs[s.loc];
  return !!l && (spaced(l) || ["ams", "holder", "dryer"].includes(l.kind));
};
/* Spools ranked as the likely source of one of a print's filaments: loaded ones first, then the same
   material, then the nearest colour. A lower score is a better match. */
function spoolChoices(f) {
  const want = baseMat(f.type)?.key || f.type.toUpperCase();
  return liveSpools()
    .map(s => {
      const mat =
        (baseMat(s.material)?.key || s.material.toUpperCase()) === want ||
        s.material.toUpperCase().includes(f.type.toUpperCase());
      const gap = Math.min(...colourList(s).map(c => colourGap(c, f.hex)));
      return {s, score: (loaded(s) ? 0 : 1) + (mat ? 0 : 3) + gap * 2};
    })
    .sort((a, b) => a.score - b.score);
}
function startLog(r) {
  const key = r.name + "|" + r.plates.map(p => p.fil.map(f => f.g).join(",")).join("/");
  printLog = {...r, key, plate: 0, pct: 100};
  pickSpools();
  go("log");
  render();
}
/* Chooses the best spool for each filament of the plate, never the same spool twice. */
function pickSpools() {
  const taken = new Set();
  printLog.pick = printLog.plates[printLog.plate].fil.map(f => {
    const c = spoolChoices(f).find(c => !taken.has(c.s.id) && c.score < 3);
    if (c) taken.add(c.s.id);
    return c ? c.s.id : "";
  });
}

      const ch = spoolChoices(f),
        opt = c =>
          `<option value="${c.s.id}" ${printLog.pick[i] === c.s.id ? "selected" : ""}>${esc(c.s.id.toUpperCase() + " " + c.s.material + " " + (c.s.colour || "") + ", " + (c.s.remainG ?? c.s.netG ?? "?") + " g" + (loaded(c.s) ? ", " + spotName(c.s) : ""))}</option>`;
      return `<div class="useRow"><span class="sw" style="background:${esc(f.hex || "#9AA5AB")}" aria-hidden="true"></span><div class="field"><span>Filament ${f.id}: ${esc(f.type || "Unknown")}, ${Math.round(f.g * 10) / 10} g</span>
      <select data-lp="${i}"><option value="">Don't take this off a spool</option><optgroup label="Best matches">${ch.slice(0, 6).map(opt).join("")}</optgroup><optgroup label="Everything else">${ch.slice(6).map(opt).join("")}</optgroup></select></div></div>`;
    })
    .join("");
  return `<div><div class="code">Log a print</div><h1>${esc(printLog.name)}</h1></div>
  ${done ? `<div class="note warn">You've already logged this print. Logging it again takes the filament off twice.</div>` : ""}
  <div class="card">
    ${printLog.plates.length > 1 ? `<label class="field"><span>Plate</span><select id="lpPlate">${printLog.plates.map((p, i) => `<option value="${i}" ${i === printLog.plate ? "selected" : ""}>Plate ${esc(p.plate)}</option>`).join("")}</select></label>` : ""}
    ${rows}
    <label class="field"><span>How much of it printed (%)</span><input type="number" inputmode="numeric" min="1" max="100" id="lpPct" value="${printLog.pct}"><span class="hint">Lower this for a print that failed or was cancelled.</span></label>
    <div class="btns"><button class="btn go" data-act="logSave">Take it off</button><button class="btn" data-act="logCancel">Cancel</button></div>
  </div>`;
}
/* Takes a logged print off its spools, with Undo. */
async function saveLog() {
  const pl = printLog.plates[printLog.plate],
    pct = clamp(num(printLog.pct) || 100, 1, 100) / 100,
    now = Date.now(),
    use = {};
  pl.fil.forEach((f, i) => {
    const id = printLog.pick[i];
    if (id) use[id] = (use[id] || 0) + f.g * pct;
  });
  if (!Object.keys(use).length) {
    toast("Pick at least one spool.");
    return;
  }
  for (const [id, g] of Object.entries(use)) {
    const s = S.spools[id];
    const left = Math.max(0, Math.round((s.remainG ?? s.netG ?? 0) - g)),
      prints = [{at: now, name: printLog.name, g: Math.round(g * 10) / 10}, ...(s.prints || [])].slice(0, 30);
    col("spools").doc(id).update({remainG: left, prints});
    S.spools[id] = {...s, remainG: left, prints};
  }
  saveConfig({logged: [...(S.settings.logged || []).slice(-60), printLog.key]});
  // The same record the Orca plugin leaves, so this print shows on the Usage page and can be undone from there
  const jobId = "m-" + now,
    job = {
      at: now,
      printer: "",
      job: printLog.name,
      plate: String(pl.plate ?? 1),
      pct: Math.round(pct * 100),
      source: "manual",
      items: Object.entries(use).map(([spool, g]) => ({spool, g: Math.round(g * 10) / 10})),
    };
  col("jobs").doc(jobId).set(job);
  S.jobs[jobId] = {...job, id: jobId};
  const n = Object.keys(use).length,
    low = Object.keys(use)
      .filter(id => isLow(S.spools[id]))
      .map(id => id.toUpperCase());
  printLog = null;
  go("stock");
  toast(
    `Taken off ${n} spool${n === 1 ? "" : "s"}.${low.length ? ` ${low.join(", ")} ${low.length === 1 ? "is" : "are"} now low.` : ""}`,
    "Undo",
    () => undoJob(jobId),
  );
}
async function takePrintFile(f) {
  try {
    startLog(await readSliced(f));
  } catch (m) {
    toast(typeof m === "string" ? m : "Couldn't read that file.");
  }
}

/* ==========================================================================================================
   Usage
   Every print taken off a spool is kept twice: as a document in jobs (what the Usage page, the print list and
   Undo work from) and as a line on each spool it used (what the spool's own page shows). The Orca plugin
   writes both when a print ends, and Log a print writes both here.
   ========================================================================================================== */
const USAGE_RANGES = {
  "30d": {label: "30 days", bins: 30, unit: "day"},
  "12w": {label: "12 weeks", bins: 12, unit: "week"},
  "12m": {label: "12 months", bins: 12, unit: "month"},
};
const usageRange = () => (USAGE_RANGES[local.get("usageRange")] ? local.get("usageRange") : "12w");
/* "860 g", "1.24 kg", "15.1 kg" */
const grams = g => (g >= 1000 ? `${+(g / 1000).toFixed(g >= 10000 ? 1 : 2)} kg` : `${Math.round(g)} g`);

/* Every print's use of every spool, newest first, as {at, name, g, spool, printer, job, undone}. Prints from
   before jobs were kept for hand-logged prints only exist on their spools, so those are added from there. */
function allPrints() {
  const out = [],
    seen = new Set();
  for (const j of Object.values(S.jobs))
    for (const it of j.items || []) {
      if (!it.spool || !(+it.g > 0)) continue;
      seen.add(`${it.spool}|${j.at}|${j.job}`);
      out.push({
        at: j.at,
        name: j.job || "Print",
        g: +it.g,
        spool: it.spool,
        printer: j.printer || "",
        job: j.id,
        undone: !!j.undone,
      });
    }
  for (const s of Object.values(S.spools))
    for (const x of s.prints || [])
      if (!seen.has(`${s.id}|${x.at}|${x.name}`) && +x.g > 0)
        out.push({at: x.at, name: x.name || "Print", g: +x.g, spool: s.id, printer: "", job: null, undone: false});
  return out.sort((a, b) => b.at - a.at);
}

/* The days, weeks or months of a range, oldest first, each with the grams and prints that fall in it.
   Weeks start on Monday. The last one is still running, so it has no end. */
function usageBins(prints, key) {
  const r = USAGE_RANGES[key],
    today = new Date();
  const startOf = back => {
    const d = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    if (r.unit === "day") d.setDate(d.getDate() - back);
    else if (r.unit === "week") d.setDate(d.getDate() - ((d.getDay() + 6) % 7) - 7 * back);
    else {
      d.setDate(1);
      d.setMonth(d.getMonth() - back);
    }
    return d.getTime();
  };
  const bins = [];
  for (let i = r.bins - 1; i >= 0; i--)
    bins.push({from: startOf(i), to: i ? startOf(i - 1) : Infinity, g: 0, prints: new Set()});
  for (const p of prints) {
    const b = bins.find(b => p.at >= b.from && p.at < b.to);
    if (!b) continue;
    b.g += p.g;
    b.prints.add(p.at + "|" + p.name);
  }
  return bins;
}

/* A round top for the chart's axis, and the step between its lines: at most four steps. */
function axisTop(max) {
  const steps = [5, 10, 20, 25, 50, 100, 200, 250, 500, 1000, 2000, 2500, 5000, 10000];
  const step = steps.find(s => s * 4 >= max) || 10000;
  return {step, top: Math.max(step, Math.ceil(max / step) * step)};
}

/* Filament used over time, as columns. Each column can be hovered, tapped or tabbed to for its figures, the
   tallest carries its value, and the same numbers are in the table underneath for anyone who prefers one. */
function usageChart(bins, key) {
  const unit = USAGE_RANGES[key].unit,
    max = Math.max(...bins.map(b => b.g)),
    {step, top} = axisTop(max || 1),
    peak = bins.findIndex(b => b.g === max),
    every = unit === "day" ? 5 : unit === "week" ? 2 : 1;
  const ticks = [];
  for (let v = 0; v <= top; v += step) ticks.push(v);
  const date = (t, o) => new Date(t).toLocaleDateString("en-GB", o);
  const short = b => date(b.from, unit === "month" ? {month: "short"} : {day: "numeric", month: "short"});
  const long = b =>
    unit === "day"
      ? date(b.from, {weekday: "short", day: "numeric", month: "short"})
      : unit === "week"
        ? "Week of " + short(b)
        : date(b.from, {month: "long", year: "numeric"});
  const cols = bins
    .map((b, i) => {
      const h = (b.g / top) * 100,
        edge = i < 2 ? "left" : i > bins.length - 3 ? "right" : "";
      return `<div class="colslot" tabindex="0" data-tip="${esc(grams(b.g))}" data-tip2="${esc(long(b) + ", " + plural(b.prints.size, "print"))}">${i === peak && max > 0 ? `<b class="${edge}" style="bottom:${h}%">${esc(grams(b.g))}</b>` : ""}<i style="height:${h}%"${b.g > 0 ? ' class="some"' : ""}></i></div>`;
    })
    .join("");
  return `<div class="chart">
    <div class="plot">
      ${ticks.map(v => `<div class="tick" style="bottom:${(v / top) * 100}%"><span>${v.toLocaleString("en-GB")} g</span></div>`).join("")}
      <div class="cols">${cols}</div>
    </div>
    <div class="xaxis">${bins.map((b, i) => `<span>${(bins.length - 1 - i) % every === 0 ? esc(short(b)) : ""}</span>`).join("")}</div>
  </div>
  <details class="tableview"><summary>Show as a table</summary>
    <table><thead><tr><th>${unit === "day" ? "Day" : unit === "week" ? "Week of" : "Month"}</th><th>Used</th><th>Prints</th></tr></thead>
    <tbody>${[...bins]
      .reverse()
      .map(
        b =>
          `<tr><td>${esc(unit === "week" ? short(b) : long(b))}</td><td>${Math.round(b.g)} g</td><td>${b.prints.size}</td></tr>`,
      )
      .join("")}</tbody></table>
  </details>`;
}

/* Named amounts as bars on one baseline, largest first, each with its figure at the end. */
function rankedBars(rows) {
  const max = Math.max(...rows.map(r => r[1]), 1);
  return `<div class="ranked">${rows
    .map(
      ([name, g]) =>
        `<div class="rk"><span>${esc(name)}</span><i><u style="width:${(g / max) * 100}%"></u></i><b>${esc(grams(g))}</b></div>`,
    )
    .join("")}</div>`;
}

/* Filaments that are running out: ones where every spool you have of that brand, material and colour is low.
   A low spool with a fuller twin on the shelf isn't listed. */
function lowFilaments() {
  const m = new Map();
  for (const s of liveSpools()) {
    const k = [slug(s.brand), norm(s.material), norm(s.colour)].join("|");
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(s);
  }
  return [...m.values()]
    .filter(ss => ss.every(isLow))
    .map(ss => ({spools: ss, left: ss.reduce((a, s) => a + (s.remainG ?? s.netG ?? 0), 0)}))
    .sort((a, b) => a.left - b.left);
}
const lowText = () =>
  lowFilaments()
    .map(f => {
      const s = f.spools[0];
      return `${s.brand} ${s.material}${s.colour ? ", " + s.colour : ""} (${f.left} g left)`;
    })
    .join("\n");

/* The print list: one entry per print, newest first, with what came off each spool. */
function printRows(prints, limit) {
  const m = new Map();
  for (const p of prints) {
    const k = p.job || p.at + "|" + p.name;
    if (!m.has(k)) m.set(k, {...p, items: []});
    m.get(k).items.push(p);
  }
  const all = [...m.values()];
  const rows = all.slice(0, limit).map(e => {
    const j = e.job ? S.jobs[e.job] : null;
    const took = e.items
      .map(i => `${i.g} g off <button class="link" data-go="${esc(i.spool)}">${esc(i.spool.toUpperCase())}</button>`)
      .join(", ");
    return `<div class="jobrow"><span>${when(e.at)}: ${e.printer ? esc(e.printer) + ", " : ""}${esc(e.name)}<br><span class="sub">${took}${j && j.pct && j.pct < 100 ? `, ${j.pct}% printed` : ""}${e.undone ? ". Undone" : ""}</span></span>${j && !e.undone ? `<button class="btn sm" data-act="jobUndo" data-v="${esc(j.id)}">Undo</button>` : ""}</div>`;
  });
  return {html: rows.join(""), more: all.length - rows.length};
}

/* The Usage page. */
function vUsage() {
  const key = usageRange(),
    unit = USAGE_RANGES[key].unit,
    everything = allPrints(),
    prints = everything.filter(p => !p.undone),
    bins = usageBins(prints, key),
    inRange = prints.filter(p => p.at >= bins[0].from);
  const total = inRange.reduce((a, p) => a + p.g, 0),
    count = new Set(inRange.map(p => p.at + "|" + p.name)).size;
