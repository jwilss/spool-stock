    return [...m].sort((a, b) => b[1] - a[1]);
  };
  const byMaterial = sumBy(p => {
    const s = S.spools[p.spool];
    return s ? baseMat(s.material)?.key || s.material : "Deleted spools";
  });
  const byPrinter = sumBy(p => p.printer || "Logged by hand");
  const low = lowFilaments(),
    list = printRows(everything, S.usageAll ? 200 : 12);
  const head = `<div class="cardhead"><h1>Usage</h1><button class="btn sm" data-go="log">Log a print</button></div>`;
  const lowCard = low.length
    ? `<div class="card"><div class="cardhead"><h2>Running low</h2><button class="btn sm" data-act="lowCopy">Copy list</button></div>
      <p class="hint">Filaments where every spool you have is at ${LOW_G} g or less.</p>
      <div class="list">${low.map(f => rowHTML(f.spools[0])).join("")}</div></div>`
    : "";
  if (!everything.length)
    return `${head}
    <div class="card"><h2>Nothing printed yet</h2><p>Prints taken off by the Orca plugin, or logged from a sliced file, are added up here: how much filament you use, on which printer, and in which materials.</p></div>
    ${lowCard}`;
  return `${head}
  <div class="chips" role="group" aria-label="Period">${Object.entries(USAGE_RANGES)
    .map(
      ([k, r]) =>
        `<button class="chip" data-act="usageRange" data-v="${k}" aria-pressed="${k === key}">${r.label}</button>`,
    )
    .join("")}</div>
  <div class="stats">
    <div class="stat"><span>Filament used</span><b>${esc(grams(total))}</b></div>
    <div class="stat"><span>Prints</span><b>${count}</b></div>
    <div class="stat"><span>Average per print</span><b>${count ? esc(grams(total / count)) : "-"}</b></div>
  </div>
  <div class="card"><h2>Filament used per ${unit}</h2>${usageChart(bins, key)}</div>
  ${
    inRange.length
      ? `<div class="split even">
    <div class="card"><h2>By material</h2>${rankedBars(byMaterial)}</div>
    <div class="card"><h2>By printer</h2>${rankedBars(byPrinter)}</div>
  </div>`
      : ""
  }
  ${lowCard}
  <div class="card"><h2>Prints</h2><div class="hist">${list.html}</div>
    ${list.more > 0 ? `<div class="btns"><button class="btn" data-act="usageMore">Show ${list.more} more</button></div>` : ""}
  </div>`;
}

/* Puts a print's grams back on its spools and marks it undone. */
async function undoJob(id) {
  const j = S.jobs[id];
  if (!j || j.undone) return;
  for (const it of j.items || []) {
    const s = S.spools[it.spool];
    if (!s) continue;
    const prints = (s.prints || []).filter(x => !(x.at === j.at && x.name === j.job)),
      remainG = Math.min(FULL_G, Math.round((s.remainG ?? s.netG ?? 0) + (+it.g || 0)));
    col("spools").doc(s.id).update({remainG, prints});
    S.spools[s.id] = {...s, remainG, prints};
  }
  col("jobs").doc(id).update({undone: true});
  S.jobs[id] = {...j, undone: true};
  toast("Put back on " + plural((j.items || []).length, "spool") + ".");
  render();
}

/* ==========================================================================================================
   Orca
   The plugin's card in Setup, the presets for the filaments you own, and the list the plugin builds on.
   ========================================================================================================== */
/* The Orca plugin takes each print off the spools in the trays it used, and records it in jobs for Undo. */
function pluginCard() {
  const jobs = Object.values(S.jobs).filter(j => j.source !== "manual");
  const url = "spool_stock.py";
  return `<div class="card"><h2>Orca plugin</h2>
    <p>For Bambu printers in LAN mode. When a print ends, the plugin takes what it used off the spools in the trays it printed from, going by the printers above. A failed or cancelled print waits in Orca's Spool Stock tab, with how far it got, for you to check.</p>
    <p>Its tab also shows your stock and your cameras (Tapo and other RTSP cameras), and it can keep a Spool Stock group in Orca's filament list with one preset for each filament you own, updated as your stock changes.</p>
    <div class="btns">${url ? `<a class="btn" href="${esc(url)}" download>Download the plugin</a>` : ""}<button class="btn" data-act="pluginCode">Copy sign-in code</button></div>
    <p class="hint">Paste the code into the plugin's tab once. It lets the plugin change your stock, so treat it like a password. Changing your password cancels it.</p>
    ${jobs.length ? `<div class="btns"><button class="btn" data-go="usage">See its prints in Usage</button></div>` : ""}
  </div>`;
}
/* Orca filament presets for the filaments you own */
const ORCA_VERSION = "2.4.0.0";
/* The generic Orca profile closest to a filament, such as Generic PLA Silk or Generic PETG HF. */
function orcaGenericFor(material, finish) {
  const t = ` ${String(material).toUpperCase()} ${String(finish || "").toUpperCase()} `,
    k = baseMat(material)?.key || "";
  const fast = /\bHS\b|HIGH ?SPEED|RAPID|FAST|HYPER|\bHF\b/.test(t);
  const want =
    k === "PLA"
      ? /SILK/.test(t)
        ? "PLA Silk"
        : /MATTE/.test(t)
          ? "PLA Matte"
          : fast
            ? "PLA High Speed"
            : "PLA"
      : k === "PETG"
        ? fast
          ? "PETG HF"
          : "PETG"
        : k === "PET-CF"
          ? "PETG-CF"
          : k === "PPS"
            ? "PC"
            : /HIPS/.test(t)
              ? "HIPS"
              : /PCTG/.test(t)
                ? "PCTG"
                : /\bPP\b/.test(t)
                  ? "PP"
                  : k || "PLA";
  const has = n => (ORCA_GENERIC.includes(`Generic ${n} @System`) ? `Generic ${n} @System` : null);
  return has(want) || has(k) || "Generic PLA @System";
}
/* The different filaments you own (brand and material), each with its spools. */
function ownedFilaments() {
  const m = new Map();
  for (const s of liveSpools()) {
    const k = slug(s.brand) + "|" + norm(s.material);
    if (!m.has(k)) m.set(k, {brand: s.brand, material: s.material, finish: s.finish, spools: []});
    m.get(k).spools.push(s);
  }
  return [...m.values()].sort((a, b) => (a.brand + a.material).localeCompare(b.brand + b.material));
}
const orcaName = f =>
  `${f.brand} ${f.material} (Spool Stock)`
    .replace(/[\\/:*?"<>|]+/g, "-")
    .replace(/\s+/g, " ")
    .trim();
/* What a filament becomes in Orca: Orca's own profile when it has one, or a new preset on a generic one. */
function orcaPreset(f) {
  const line = catLine(f.brand, f.material),
    v = lookup(f.brand, f.material),
    name = orcaName(f);
  if (line?.o) {
    const alias = line.o.replace(/ @System$/, "");
    return {f, name: alias, own: true, names: [line.o, ...(ORCA_VARIANTS[alias] || [])]};
  }
  const base = orcaGenericFor(f.material, f.finish),
    useTemps = v.nMin != null || v.bMin != null;
  const p = {
    type: "filament",
    name,
    from: "User",
    instantiation: "true",
    inherits: base,
    version: ORCA_VERSION,
    filament_settings_id: [name],
    filament_vendor: [f.brand],
  };
  const q = x => [String(Math.round(x))];
  if (useTemps && v.nMin != null && v.nMax != null) {
    const n = Math.round((v.nMin + v.nMax) / 10) * 5;
    Object.assign(p, {
      nozzle_temperature: q(n),
      nozzle_temperature_initial_layer: q(Math.min(v.nMax, n + 5)),
      nozzle_temperature_range_low: q(v.nMin),
      nozzle_temperature_range_high: q(v.nMax),
    });
  }
  if (useTemps && v.bMin != null && v.bMax != null) {
    const b = Math.round((v.bMin + v.bMax) / 2);
    for (const k of ["hot_plate_temp", "textured_plate_temp", "eng_plate_temp"])
      Object.assign(p, {[k]: q(b), [k + "_initial_layer"]: q(b)});
  }
  if (line?.d) p.filament_density = [String(line.d)];
  return {
    f,
    name,
    file: name + ".json",
    text: JSON.stringify(p, null, 4),
    base: base.replace(/ @System$/, ""),
    own: false,
    useTemps,
  };
}
const CRC = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();
/* A zip of text files, built without a library (stored, not compressed). */
function makeZip(files) {
  const enc = new TextEncoder(),
    parts = [],
    central = [];

  for (const {name, text} of files) {
    const nm = enc.encode(name),
      data = enc.encode(text);
    let crc = 0xffffffff;
    for (const b of data) crc = CRC[(crc ^ b) & 255] ^ (crc >>> 8);
    crc = (crc ^ 0xffffffff) >>> 0;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true);
    lh.setUint16(4, 20, true);
    lh.setUint16(6, 0x0800, true);
    lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true);
    lh.setUint32(22, data.length, true);
    lh.setUint16(26, nm.length, true);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true);
    ch.setUint16(4, 20, true);
    ch.setUint16(6, 20, true);
    ch.setUint16(8, 0x0800, true);
    ch.setUint32(16, crc, true);
    ch.setUint32(20, data.length, true);
    ch.setUint32(24, data.length, true);
    ch.setUint16(28, nm.length, true);
    ch.setUint32(42, off, true);
    parts.push(lh, nm, data);
    central.push(ch, nm);
    off += 30 + nm.length + data.length;
  }
  const size = central.reduce((a, x) => a + x.byteLength, 0),
    end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, files.length, true);
  end.setUint16(10, files.length, true);
  end.setUint32(12, size, true);
  end.setUint32(16, off, true);
  return new Blob([...parts, ...central, end], {type: "application/zip"});
}

/* The Orca plugin turns this list into a Spool Stock group in Orca's filament list. It's kept in config/orca
   and rewritten whenever the filaments you own, or the settings for them, change. */
function orcaFeed() {
  return ownedFilaments().map(f => {
    const x = orcaPreset(f),
      name = orcaName(f),
      label = `${f.brand} ${f.material}`.trim();
    if (x.own) {
      const p = {
        type: "filament",
        name,
        from: "User",
        instantiation: "true",
        inherits: x.names[0],
        version: ORCA_VERSION,
        filament_settings_id: [name],
        filament_vendor: [f.brand],
      };
      return {name, label, own: true, parents: x.names, text: JSON.stringify(p)};
    }
    const p = JSON.parse(x.text),
      k = baseMat(f.material)?.key;
    return {
      name,
      label,
      own: false,
      parents: [...new Set([p.inherits, ...(k ? [`Generic ${k} @System`] : []), "Generic PLA @System"])],
      text: JSON.stringify(p),
    };
  });
}
const fnv = s => {
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return h.toString(16);
};
let orcaTimer = null;
function orcaFeedSync() {
  clearTimeout(orcaTimer);
  orcaTimer = setTimeout(() => {
    if (!db || !S.ready || !S.live || !CAT || !S.orcaSeen) return;
    const items = orcaFeed();
    if (!items.length && !S.orcaSig) return;
    const sig = fnv(JSON.stringify(items));
    if (sig === S.orcaSig) return;
    S.orcaSig = sig;
    db.doc("config/orca").set({v: 1, sig, at: Date.now(), items});
  }, 1500);
}

/* Copy text. The Windows and Android apps refuse the newer clipboard call, so fall back to the older one. */
async function copyText(t) {
  try {
    await navigator.clipboard.writeText(t);
    return true;
  } catch {}
  try {
    const a = document.createElement("textarea");
    a.value = t;
    a.setAttribute("readonly", "");
    a.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;opacity:0";
    document.body.append(a);
    a.select();
    const done = document.execCommand("copy");
    a.remove();
    return done;
  } catch {
    return false;
  }
}
let toastT = null;
/* A message at the bottom of the screen, with an optional button such as Undo. */
function toast(msg, label, fn) {
  const t = $("#toast");
  t.hidden = false;
  t.innerHTML = `<span>${esc(msg)}</span>`;
  if (label) {
    const b = document.createElement("button");
    b.textContent = label;
    b.onclick = () => {
      t.hidden = true;
      fn && fn();
    };
    t.append(b);
  }
  clearTimeout(toastT);
  toastT = setTimeout(
    () => {
      t.hidden = true;
    },
    label ? 9000 : 4500,
  );
}
/* A dialog with buttons, each given as [label, what to do, extra class]. */
function ask(title, msg, btns) {
  const m = $("#modal");
  m.hidden = false;
  m.innerHTML = `<div role="dialog" aria-modal="true"><h2>${esc(title)}</h2><p>${esc(msg)}</p><div class="btns" id="askBtns"></div></div>`;
  btns.forEach(([t, fn, cls]) => {
    const b = document.createElement("button");
    b.className = "btn " + (cls || "");
    b.textContent = t;
    b.onclick = () => {
      m.hidden = true;
      fn && fn();
    };
    $("#askBtns").append(b);
  });
}

  arrPick(el) {
    const l = S.locs[S.param],
      i = +el.dataset.v,
      sp = spaced(l),
      cells = sp ? seated(l) : looseOrder(l),
      at = cells[i];
    if (!S.arrSel) {
      if (at) {
        S.arrSel = at.id;
        render();
      }
      return;
    }
    const id = S.arrSel;
    S.arrSel = null;
    if (at && at.id === id) {
      render();
      return;
    }
    if (sp) {
      const from = cells.findIndex(s => s && s.id === id);
      col("spools")
        .doc(id)
        .update({slot: i + 1});
      S.spools[id].slot = i + 1;
      if (at) {
        col("spools")
          .doc(at.id)
          .update({slot: from + 1});
        S.spools[at.id].slot = from + 1;
      }
    } else {
      const list = cells.filter(s => s.id !== id),
        to = at ? list.findIndex(s => s.id === at.id) : list.length;
      list.splice(to, 0, S.spools[id]);
      list.forEach((s, n) => {
        if (s.pos !== n + 1) {
          col("spools")
            .doc(s.id)
            .update({pos: n + 1});
          S.spools[s.id].pos = n + 1;
        }
      });
    }
    render();
  },

    const s = S.spools[S.param],
      n = +el.dataset.v,
      l = S.locs[s.loc],
      mine = spaceOf(s),
      other = seated(l)[n - 1];
    if (n === mine) return;
    col("spools").doc(s.id).update({slot: n});
    S.spools[s.id].slot = n;
    if (other) {
      col("spools").doc(other.id).update({slot: mine});
      S.spools[other.id].slot = mine;

    render();

document.addEventListener("change", async e => {
  const t = e.target;
  if (t.dataset && t.dataset.act === "pick") {
    actions.pick(t);
    return;
  }
  if (t.id === "scanTarget") {
    if (t.value) local.set("scanTarget", t.value);
    else local.del("scanTarget");
    return;
  }
  if (t.id === "sheetSel") {
    const st = {...(S.settings.sheet || {}), id: t.value, start: 0};
    if (t.value === "custom" && !st.custom)
      st.custom = {w: 63.5, h: 38.1, cols: 3, rows: 7, left: 7.25, top: 15.15, px: 66, py: 38.1};
    await saveConfig({sheet: st});
    render();
    return;
  }
  if (t.id && t.id.startsWith("cu_")) {
    const st = S.settings.sheet || {},
      c = {...(st.custom || {})};
    c[t.id.slice(3)] = num(t.value) || 0;
    await saveConfig({sheet: {...st, custom: c}});
    render();
    return;
  }
  if (t.id === "nudgeX" || t.id === "nudgeY") {
    const st = S.settings.sheet || {};
    await saveConfig({sheet: {...st, [t.id === "nudgeX" ? "nx" : "ny"]: num(t.value) || 0}});
    return;
  }
  if (t.id === "outline") {
    queueOpts.outline = t.checked;
    return;
  }
  if (t.id && /^pf_loc_\d+$/.test(t.id) && printerEdit) {
    readPrinter();
    render();
    return;
  }
  if (t.name === "s_kind") {
    readStore();
    Object.assign(storeEdit, storeDefaults(t.value));
    render();
    return;
  }
  if (t.id === "s_spaces") {
    readStore();
    render();
    return;
  }
  if (t.id === "pickScan" && t.files[0]) {
    const f = t.files[0];
    t.value = "";
    const out = $("#scanOut");
    if (out) {
      out.hidden = false;
      out.innerHTML = `<div class="busy"><span class="spin"></span>Reading the sticker</div>`;
    }
    const raw = await decodeQR(f).catch(() => null);
    if (out) {
      out.hidden = true;
      out.innerHTML = "";
    }
    const code = parseCode(raw);
    if (code) handleScan(code, "page");
    else
      toast(
        raw ? "That code isn't one of your stickers." : "Couldn't find a code in that photo. Get closer and try again.",
      );
    return;
  }
  if (t.id === "pickPrint" && t.files[0]) {
    const f = t.files[0];
    t.value = "";
    takePrintFile(f);
    return;
  }
  if (t.dataset && t.dataset.lp != null && printLog) {
    printLog.pick[+t.dataset.lp] = t.value;
    return;
  }
  if (t.id === "lpPlate" && printLog) {
    printLog.plate = +t.value;
    pickSpools();
    render();
    return;
  }
  if (t.id === "lpPct" && printLog) {
    printLog.pct = t.value;
    return;
  }
  if (t.id === "pickBackup" && t.files[0]) {
    const f = t.files[0];
    t.value = "";
    try {
      restoreJob = readBackup(await f.text(), f.name);
      render();
    } catch (m) {
      toast(String(m));
    }
    return;
  }
  if (t.id === "sortSel") {
    local.set("stockSort", t.value);
    const box = $("#spoolList");
    if (box) box.innerHTML = stockRows();
    return;
  }
  if (t.id === "themeSel") {
    if (t.value) local.set("theme", t.value);
    else local.del("theme");
    applyTheme();
    return;
  }
  if (t.id === "pickImport" && t.files[0]) {
    const f = t.files[0];
    t.value = "";
    try {
      importJob = parseImport(await f.text());
      render();
    } catch (m) {
      toast(String(m));
    }
    return;
  }
  if (t.dataset && t.dataset.imp != null && importJob) {
    const it = importJob.items.find(i => String(i.key) === t.dataset.imp);
    if (it) it.on = t.checked;
    const l = $("#importLoc");
    importJob.loc = l ? l.value : "";
    render();
    return;
  }
  if (t.id === "pickLogo" && t.files[0]) {
    const f = t.files[0];
    t.value = "";
    if (S.view === "add" || S.view === "edit") readForm();
    if (/svg/.test(f.type)) {
      const cv = await svgInk(await f.text()).catch(() => null);
      if (cv && (await storeInk(pendingLogo, cv, {from: "Your vector"}))) {
        logoPicker = null;
        toast(pendingLogo + " logo saved.");
        render();
      } else toast("That vector file wouldn't open.");
      return;
    }
    const img = await loadImg(f),
      c = toCanvas(img, 1600),
      blob = await canvasBlob(c, "image/png");
    logoPicker = null;
    openCrop(URL.createObjectURL(blob), c.width, c.height, pendingLogo || "Logo", [0, 0, 1, 1], S.view);
    render();
    return;
  }
});

  if (t.dataset && t.dataset.colour && spoolEdit) {

  if (t.id === "q") {

  if (t.id && t.id.startsWith("f_") && spoolEdit) {

      spoolEdit.touched = true;
      spoolEdit.src = "edited";
      formPreview();
    } else if (t.id === "f_hex") {
      spoolEdit.hexTouched = true;
      formPreview();
    } else if (t.id === "f_pattern") {
      if (spoolEdit.pattern !== "solid" && spoolEdit.colours.length < 2) spoolEdit.colours.push("#FFFFFF");
      $("#colourRow").innerHTML = colourRow();
      formPreview();
    } else if (t.id === "f_colour") {
      const known = catLine(spoolEdit.brand, spoolEdit.material)?.c.find(c => norm(c[0]) === norm(spoolEdit.colour));
      if (known) {

        if (h) h.value = n[1];

    } else if (t.id === "f_brand" || t.id === "f_material") {
      if (spoolEdit.src === "edited" || spoolEdit.src === "label") {

   redraw that lands in between can't put it back. */
document.addEventListener("click", e => {
  const sum = e.target.closest && e.target.closest(".fold > summary");
  if (!sum) return;
  const sect = sum.parentElement,
    all = [...document.querySelectorAll("[data-sect]")].map(d => d.dataset.sect),
    open = new Set(setupOpen() || all);
  if (sect.open) open.delete(sect.dataset.sect);
  else open.add(sect.dataset.sect);
  local.set("setupOpen", [...open]);
});
/* Keyboard: / searches the stock from anywhere, Esc closes a question. */
addEventListener("keydown", e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || "");
  if (e.key === "Escape" && !$("#modal").hidden) {
    $("#modal").hidden = true;
    return;
  }
  if (e.key !== "/" || typing || e.ctrlKey || e.metaKey || e.altKey || !db || !S.ready) return;
  e.preventDefault();
  S.focusSearch = true;
  if (S.view === "stock") render();
  else go("stock");
});

/* One tooltip for anything carrying data-tip (the figure) and data-tip2 (what it is), shown on hover, tap
   and keyboard focus. Text goes in with textContent, as print names come from files. */
function showTip(el) {
  const t = $("#tip"),
    figure = document.createElement("b"),
    label = document.createElement("span");
  figure.textContent = el.dataset.tip;
  label.textContent = el.dataset.tip2 || "";
  t.replaceChildren(figure, label);
  t.hidden = false;
  const r = (el.querySelector("i") || el).getBoundingClientRect();
  t.style.left = clamp(r.left + r.width / 2 - t.offsetWidth / 2, 8, innerWidth - t.offsetWidth - 8) + "px";
  t.style.top = Math.max(8, r.top - t.offsetHeight - 8) + "px";
}
const hideTip = () => {
  $("#tip").hidden = true;
};
for (const ev of ["pointerover", "focusin"])
  document.addEventListener(ev, e => {
    const el = e.target.closest && e.target.closest("[data-tip]");
    if (el) showTip(el);
  });
for (const ev of ["pointerout", "focusout"]) document.addEventListener(ev, hideTip);
addEventListener("scroll", hideTip, {passive: true});

/* crop dragging */
document.addEventListener("pointerdown", e => {
  const b = e.target.closest && e.target.closest("#cropBox");
  if (!b || !crop) return;
  const r = b.getBoundingClientRect(),
    pos = ev => [clamp((ev.clientX - r.left) / r.width, 0, 1), clamp((ev.clientY - r.top) / r.height, 0, 1)],
    s = pos(e);
  b.setPointerCapture(e.pointerId);
  const mv = ev => {
    const p = pos(ev);
    crop.box = [Math.min(s[0], p[0]), Math.min(s[1], p[1]), Math.max(s[0], p[0]), Math.max(s[1], p[1])];
    drawCrop();
  };
  const up = () => {
    b.removeEventListener("pointermove", mv);
    b.removeEventListener("pointerup", up);
  };
  b.addEventListener("pointermove", mv);
  b.addEventListener("pointerup", up);
});

/* ==========================================================================================================
   Start
   Starts Firebase, waits for sign-in, then watches this user's data.
   ========================================================================================================== */
(async () => {
  render();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  if (!CFG.firebase || !window.firebase) {
    started = true;
    render();
    return;
  }
  firebase.initializeApp(CFG.firebase);
  fs = firebase.firestore();
  try {
    fs.settings({ignoreUndefinedProperties: true});
  } catch {}
  try {
    await Promise.race([fs.enablePersistence({synchronizeTabs: true}), new Promise(res => setTimeout(res, 4000))]);
  } catch {}
  started = true;
  render();
  firebase.auth().onAuthStateChanged(u => {
    if (!u) {
      uid = null;
      db = null;
      render();
      return;
    }
    if (uid === u.uid) return;
    uid = u.uid;
    const base = `users/${uid}/`;
    db = {collection: n => wrapCol(fs.collection(base + n)), doc: p => wrapDoc(fs.doc(base + p))};
    render();
    watch();
  });
})();
</script>
